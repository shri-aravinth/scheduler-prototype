<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EHR Scheduler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{
  --bg:#07090f;--surf:#0e1118;--surf2:#111827;--faint:#1e2535;
  --brd:rgba(255,255,255,.07);--txt:#e2e8f0;--mut:#64748b;--mut2:#4b5a72;
  --acc:#6366f1;--acc2:#818cf8;--accbg:rgba(99,102,241,.12);--accbr:rgba(99,102,241,.3);
  --grn:#10b981;--fn:'Geist','Segoe UI',system-ui,sans-serif;
}
body{font-family:var(--fn);background:var(--bg);color:var(--txt);font-size:13px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}
::-webkit-scrollbar-track{background:transparent;}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes rptRow{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surf);border-bottom:1px solid var(--brd);flex-shrink:0;z-index:30;}
.logo-icon{width:26px;height:26px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.logo-name{font-weight:700;font-size:14px;letter-spacing:-.4px;color:var(--txt);}
.logo-badge{font-size:10px;font-weight:700;background:var(--accbg);color:var(--acc);padding:2px 7px;border-radius:4px;letter-spacing:.5px;border:1px solid var(--accbr);}
.topbar-sp{flex:1;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.18);border-radius:20px;padding:3px 10px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite;}
.status-lbl{font-size:11px;color:var(--grn);font-weight:600;}
#body{flex:1;display:flex;overflow:hidden;}
#lp{width:44%;display:flex;flex-direction:column;border-right:1px solid var(--brd);overflow:hidden;transition:width .25s cubic-bezier(.4,0,.2,1);}
#lp.exp{width:100%;border-right:none;}
#lp.col{width:0;overflow:hidden;border-right:none;}
#rp{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#rp.col{display:none;}
.ph{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--brd);background:var(--surf);flex-shrink:0;}
.ph-title{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;}
.xbtn{width:32px;height:32px;border-radius:8px;background:var(--accbg);border:1px solid var(--accbr);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--acc);transition:all .15s;flex-shrink:0;}
.xbtn:hover{background:rgba(99,102,241,.22);box-shadow:0 0 0 2px var(--accbr);}
.xbtn svg{display:block;}
#thread{flex:1;overflow-y:auto;padding:16px 16px 0;}
#es{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:32px;text-align:center;}
.es-icon{width:52px;height:52px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 32px rgba(99,102,241,.25);}
.es-title{font-size:17px;font-weight:800;color:var(--txt);letter-spacing:-.4px;margin-bottom:6px;}
.es-sub{font-size:12px;color:var(--mut);line-height:1.7;max-width:320px;}
.cg{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:360px;}
.chip,.qchip{font-family:var(--fn);font-size:11px;color:var(--mut);background:rgba(255,255,255,.03);border:1px solid var(--brd);border-radius:20px;padding:6px 13px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip:hover,.qchip:hover{background:var(--accbg);color:var(--acc2);border-color:var(--accbr);transform:translateY(-1px);}
.qchip{font-size:10px;padding:4px 10px;border-radius:14px;}
#qbar{padding:7px 12px;display:flex;gap:6px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;scrollbar-width:none;}
#qbar::-webkit-scrollbar{display:none;}
.msg{margin-bottom:16px;animation:fadeUp .2s ease;}
.mu{display:flex;justify-content:flex-end;}
.mub{background:linear-gradient(135deg,#4f46e5,#6d28d9);border-radius:14px 14px 3px 14px;padding:9px 14px;max-width:80%;font-size:13px;color:#fff;line-height:1.6;box-shadow:0 4px 14px rgba(99,102,241,.22);}
.mb{display:flex;gap:9px;align-items:flex-start;}
.bav{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;}
.bbd{flex:1;min-width:0;}
.ir{display:flex;align-items:center;gap:5px;margin-bottom:8px;}
.idot{width:4px;height:4px;border-radius:50%;background:var(--acc);flex-shrink:0;}
.it{font-size:9px;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.8px;}
.fu{font-size:10.5px;color:var(--mut);margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05);}
.tybub{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:3px 14px 14px 14px;padding:10px 14px;width:fit-content;}
.tyd{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:blink 1.3s infinite;}
.tyd:nth-child(2){animation-delay:.22s;}.tyd:nth-child(3){animation-delay:.44s;}
.tyl{font-size:10px;color:var(--mut);margin-left:3px;}
#ibar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--brd);background:var(--surf);flex-shrink:0;align-items:flex-end;}
.iw{flex:1;display:flex;gap:8px;align-items:flex-end;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:12px;padding:8px 8px 8px 12px;transition:border-color .15s;}
.iw:focus-within{border-color:var(--accbr);}
#ci{flex:1;background:none;border:none;color:var(--txt);font-family:var(--fn);font-size:13px;line-height:1.6;resize:none;outline:none;min-height:22px;max-height:100px;overflow-y:auto;}
#ci::placeholder{color:var(--mut2);}
#sb{width:32px;height:32px;border-radius:8px;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;flex-shrink:0;}
#sb:hover{background:#4f46e5;transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.35);}
#sb:disabled{background:var(--faint);color:var(--mut);cursor:not-allowed;transform:none;box-shadow:none;}
.itw{border:1px solid var(--brd);border-radius:10px;overflow:hidden;}
.ttb{display:flex;align-items:center;background:rgba(255,255,255,.025);border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none;padding:0 6px 0 2px;gap:2px;flex-shrink:0;}
.ttb::-webkit-scrollbar{display:none;}
.sc{display:flex;gap:5px;align-items:center;padding:7px 11px;border:none;background:none;border-bottom:2px solid transparent;color:var(--mut);font-size:10.5px;cursor:pointer;font-family:var(--fn);transition:all .15s;white-space:nowrap;flex-shrink:0;}
.sc:hover{color:var(--acc2);border-bottom-color:var(--acc2);}
.sc.active{color:var(--acc2);border-bottom-color:var(--acc);background:var(--accbg);}
.sc .num{font-family:monospace;font-weight:800;font-size:11px;}
.tsp{flex:1;}.rct{font-size:10px;color:var(--mut);padding:0 8px;white-space:nowrap;}
.tscr{overflow-x:auto;max-height:280px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;}
thead th{padding:7px 10px;text-align:left;font-size:9.5px;font-family:monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:600;border-bottom:1px solid var(--brd);background:rgba(255,255,255,.025);white-space:nowrap;cursor:pointer;user-select:none;transition:color .12s;position:sticky;top:0;z-index:1;}
thead th:hover{color:var(--txt);}
thead th.srt{color:var(--acc2);}
.sorticon{display:inline-flex;flex-direction:column;gap:1px;margin-left:4px;vertical-align:middle;}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:background .1s;}
tbody tr:hover{background:rgba(255,255,255,.025);}
tbody td{padding:7px 10px;vertical-align:middle;color:var(--txt);font-size:11.5px;white-space:nowrap;}
.nor td{text-align:center;color:var(--mut);padding:22px;font-size:11px;}
.badge{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.badge-Pending   {background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.badge-High      {background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.badge-Medium    {background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.badge-Low       {background:rgba(99,102,241,.1);color:#a5b4fc;border:1px solid rgba(99,102,241,.25);}
.badge-Late      {background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.badge-Incomplete{background:rgba(249,115,22,.1);color:#fb923c;border:1px solid rgba(249,115,22,.25);}
.badge-Completed {background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.25);}
.badge-Unassigned{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.badge-Assigned  {background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.25);}
.badge-Missed    {background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.badge-Declined  {background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.badge-Rescheduled{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25);}
.badge-Reassigned{background:rgba(99,102,241,.1);color:#a5b4fc;border:1px solid rgba(99,102,241,.25);}
.badge-Yes{background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.25);}
.badge-No{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.25);}
.idl{font-family:monospace;font-size:10px;color:var(--mut);}
#rc{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#dash{flex:1;overflow-y:auto;background:var(--bg);}
.dh{padding:28px 24px 24px;border-bottom:1px solid var(--brd);background:linear-gradient(135deg,var(--surf) 0%,rgba(99,102,241,.05) 100%);}
.dd{font-size:11px;color:var(--mut);letter-spacing:.6px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.dg{font-size:26px;font-weight:800;color:var(--txt);letter-spacing:-.6px;line-height:1.15;margin-bottom:6px;}
.dg .nm{background:linear-gradient(90deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dsub{font-size:13px;color:var(--mut);line-height:1.6;}
.rs{padding:20px 24px;}
.sl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-bottom:12px;}
.rch{display:grid;grid-template-columns:3px 44px 1fr 88px 88px 88px 40px;align-items:center;padding:0 0 8px;border-bottom:1px solid var(--brd);margin-bottom:8px;}
.rch .ch{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:700;}
.rr{display:grid;grid-template-columns:3px 44px 1fr 88px 88px 88px 40px;align-items:stretch;background:var(--surf);border:1px solid var(--brd);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;margin-bottom:8px;transition:border-color .18s,background .18s,box-shadow .18s;font-family:var(--fn);width:100%;animation:rptRow .25s ease both;}
.rr:hover{border-color:var(--accbr);background:rgba(99,102,241,.04);box-shadow:0 2px 16px rgba(99,102,241,.1);}
.ra{opacity:.75;}.ri{display:flex;align-items:center;justify-content:center;font-size:18px;padding:0 2px;}
.rn{padding:14px 12px 14px 4px;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.rn .lb{font-size:13px;font-weight:700;color:var(--txt);letter-spacing:-.2px;line-height:1;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.rn .dc{font-size:11px;color:var(--mut);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rst{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;border-left:1px solid var(--brd);}
.rst .v{font-size:19px;font-weight:800;font-family:monospace;line-height:1;margin-bottom:4px;}
.rst .l{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.55px;font-weight:700;text-align:center;line-height:1.3;}
.raro{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px;border-left:1px solid var(--brd);padding:0 4px;}
#rv{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#rtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--brd);background:var(--surf);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#rtabs::-webkit-scrollbar{display:none;}
.rt{font-family:var(--fn);font-size:11px;font-weight:500;padding:0 14px;height:38px;border:none;background:none;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.rt:hover{color:var(--txt);}.rt.active{color:var(--acc2);border-bottom-color:var(--acc);}
.rtb{font-family:monospace;font-size:9px;background:var(--accbg);color:var(--acc2);border:1px solid var(--accbr);border-radius:8px;padding:1px 5px;}
#stiles{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
#stiles::-webkit-scrollbar{display:none;}
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px;padding:9px 14px;border-radius:10px;border:1px solid var(--brd);background:rgba(255,255,255,.025);cursor:pointer;flex-shrink:0;transition:all .15s;font-family:var(--fn);}
.st:hover{border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.06);}
.st.active{border-color:rgba(99,102,241,.45);background:var(--accbg);}
.st .tv{font-family:monospace;font-size:20px;font-weight:800;color:var(--txt);line-height:1;margin-bottom:4px;}
.st.active .tv{color:var(--acc2);}.st .tl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:center;line-height:1.2;}
.st.active .tl{color:var(--acc2);}.stb{width:16px;height:2px;background:var(--acc);border-radius:1px;margin-top:5px;}
#fb{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--brd);background:var(--surf);flex-shrink:0;flex-wrap:wrap;align-items:center;}
.sw{position:relative;flex:1 1 140px;}
.sico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
#sinput{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:7px;padding:6px 9px 6px 30px;color:var(--txt);font-family:var(--fn);font-size:11.5px;outline:none;transition:border-color .15s;}
#sinput:focus{border-color:var(--accbr);}#sinput::placeholder{color:var(--mut2);}
.fs{background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:7px;padding:6px 9px;color:var(--mut);font-family:var(--fn);font-size:11.5px;cursor:pointer;outline:none;transition:border-color .15s;}
.fs:focus{border-color:var(--accbr);}
.fcount{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap;flex-shrink:0;}
#rtw{flex:1;overflow-y:auto;}
#rtw thead th{font-size:9.5px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo-icon">🏥</div>
    <span class="logo-name">EHR Scheduler</span>
    <span class="logo-badge">MCP APP</span>
    <div class="topbar-sp"></div>
    <div class="status-pill"><div class="status-dot"></div><span class="status-lbl">mcp-app-prototype · 21 tools</span></div>
  </div>
  <div id="body">
    <div id="lp">
      <div class="ph">
        <span class="ph-title">Chat</span>
        <button class="xbtn" id="lbtn" title="Expand chat"></button>
      </div>

        <div id="es">
          <div class="es-icon">🏥</div>
          <div><div class="es-title">EHR Scheduling Assistant</div><div class="es-sub">Ask a question or pick an option below. Results render as live tables directly in the chat.</div></div>
          <div class="cg" id="cg"></div>
        </div>
      </div>
      <div id="qbar" style="display:none"></div>
      <div id="ibar">
        <div class="iw">
          <textarea id="ci" rows="1" placeholder="Ask about visits or take actions…"></textarea>
          <button id="sb" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
      </div>
    </div>
    <div id="rp">
      <div class="ph">
        <button class="xbtn" id="rbtn" title="Expand reports"></button>
        <span class="ph-title">Reports</span>
      </div>
      <div id="rc"></div>
    </div>
  </div>
</div>

let ads="agentSummary",rf={},rs="",rsc=null,rsd="asc",rtp=null,rtk=null;
function navTo(ds){ads=ds;rf={};rs="";rsc=null;rsd="asc";rtp=null;rtk=null;renderReport();}
function renderReport(){document.getElementById("rc").innerHTML=`<div id="rv"><div id="rtabs"></div><div id="stiles"></div><div id="fb"><div class="sw"><svg class="sico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="sinput" placeholder="Search..."/></div><div id="fsel"></div><span class="fcount" id="fcount"></span></div><div id="rtw"><table><thead id="rth"></thead><tbody id="rtb"></tbody></table></div></div>`;rTabs();rTiles();rFilSel();rTbl();document.getElementById("sinput").addEventListener("input",e=>{rs=e.target.value;rTbl();});}
function rTabs(){const el=document.getElementById("rtabs");if(!el)return;el.innerHTML=`<button class="rt" id="dbk">← Dashboard</button>`+Object.entries(DSC).map(([k,c])=>`<button class="rt${k===ads?" active":""}" data-ds="${k}">${c.label}<span class="rtb">${_store[k].length}</span></button>`).join("");document.getElementById("dbk").addEventListener("click",renderDash);el.querySelectorAll(".rt[data-ds]").forEach(b=>b.addEventListener("click",()=>{ads=b.dataset.ds;rf={};rs="";rsc=null;rsd="asc";rtp=null;rtk=null;rTabs();rTiles();rFilSel();rTbl();const s=document.getElementById("sinput");if(s)s.value="";}));}
function rTiles(){const el=document.getElementById("stiles");if(!el)return;const sum=DSC[ads].sumFn(_store[ads]);el.innerHTML=Object.entries(sum).map(([k,s])=>`<button class="st${rtk===k?" active":""}" data-k="${k}" data-f="${s.f}" style="${!s.f?'cursor:default;opacity:.55':''}"><div class="tv">${s.v}</div><div class="tl">${s.l}</div>${rtk===k?'<div class="stb"></div>':''}</button>`).join("");el.querySelectorAll(".st").forEach(b=>{if(b.dataset.f!=="true")return;b.addEventListener("click",()=>{const k=b.dataset.k,s=DSC[ads].sumFn(_store[ads])[k];if(rtk===k){rtp=null;rtk=null;}else{rtp=s.p;rtk=k;}rTiles();rTbl();});});}
function rFilSel(){const el=document.getElementById("fsel");if(!el)return;el.innerHTML=DSC[ads].filters.map(f=>`<select class="fs" data-k="${f.k}"><option value="">All ${f.l}</option>${f.o.map(o=>`<option value="${o}"${rf[f.k]===o?" selected":""}>${o}</option>`).join("")}</select>`).join("");el.querySelectorAll("select").forEach(s=>s.addEventListener("change",()=>{if(s.value)rf[s.dataset.k]=s.value;else delete rf[s.dataset.k];rTbl();}));}
function rTbl(){const cfg=DSC[ads];let rows=_store[ads];if(rtp)rows=rows.filter(rtp);cfg.filters.forEach(f=>{if(rf[f.k])rows=rows.filter(r=>f.p(r,rf[f.k]));});if(rs){const q=rs.toLowerCase();rows=rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));}rows=srt(rows,rsc,rsd);const fc=document.getElementById("fcount");if(fc)fc.textContent=`${rows.length} records`;const th=document.getElementById("rth");if(!th)return;th.innerHTML="<tr>"+cfg.cols.map(c=>`<th class="${c===rsc?"srt":""}" data-c="${c}">${fmtC(c)}${sico(c,rsc,rsd)}</th>`).join("")+"</tr>";th.querySelectorAll("th").forEach(h=>h.addEventListener("click",()=>{const c=h.dataset.c;if(rsc===c)rsd=rsd==="asc"?"desc":"asc";else{rsc=c;rsd="asc";}rTbl();}));const tb=document.getElementById("rtb");if(!tb)return;tb.innerHTML=rows.length===0?`<tr class="nor"><td colspan="${cfg.cols.length}">No records match</td></tr>`:rows.map(r=>"<tr>"+cfg.cols.map(c=>`<td>${bc(c,r[c])}</td>`).join("")+"</tr>").join("");}
// Inline Table
const IS={};
function buildIT(rows,cols,sum,id){IS[id]={rows,cols,sc:null,sd:"asc",fk:null,fp:null};const sc=sum?Object.entries(sum).map(([k,s])=>`<button class="sc" data-id="${id}" data-k="${k}" data-f="${s.f}" style="${!s.f?'cursor:default;opacity:.5':''}"><span class="num">${s.v}</span><span>${s.l}</span></button>`).join(""):"";const th="<tr>"+cols.map(c=>`<th data-id="${id}" data-c="${c}">${fmtC(c)}${sico(c,null,"asc")}</th>`).join("")+"</tr>";const tb=rows.length===0?`<tr class="nor"><td colspan="${cols.length}">No records match</td></tr>`:rows.map(r=>"<tr>"+cols.map(c=>`<td>${bc(c,r[c])}</td>`).join("")+"</tr>").join("");return`<div class="itw" id="itw-${id}"><div class="ttb">${sc}<div class="tsp"></div><span class="rct" id="rc-${id}">${rows.length} / ${rows.length}</span></div><div class="tscr"><table><thead id="th-${id}">${th}</thead><tbody id="tb-${id}">${tb}</tbody></table></div></div>`;}
function wireIT(id,ds){const st=IS[id];if(!st)return;document.querySelectorAll(`.sc[data-id="${id}"]`).forEach(b=>{if(b.dataset.f!=="true")return;b.addEventListener("click",()=>{const k=b.dataset.k,s=DSC[ds].sumFn(st.rows)[k];if(st.fk===k){st.fk=null;st.fp=null;}else{st.fk=k;st.fp=s?.p||null;}refIT(id,ds);});});wireITH(id,ds);}
function wireITH(id,ds){const th=document.getElementById(`th-${id}`);if(!th)return;th.querySelectorAll("th").forEach(h=>{h.style.cursor="pointer";h.addEventListener("click",()=>{const st=IS[id],c=h.dataset.c;if(st.sc===c)st.sd=st.sd==="asc"?"desc":"asc";else{st.sc=c;st.sd="asc";}refIT(id,ds);});});}
function refIT(id,ds){const st=IS[id];if(!st)return;let rows=st.fp?st.rows.filter(st.fp):st.rows;rows=srt(rows,st.sc,st.sd);document.querySelectorAll(`.sc[data-id="${id}"]`).forEach(b=>b.classList.toggle("active",b.dataset.k===st.fk));const rc=document.getElementById(`rc-${id}`);if(rc)rc.textContent=`${rows.length} / ${st.rows.length}`;const th=document.getElementById(`th-${id}`);if(th){th.innerHTML="<tr>"+st.cols.map(c=>`<th class="${c===st.sc?"srt":""}" data-id="${id}" data-c="${c}" style="cursor:pointer">${fmtC(c)}${sico(c,st.sc,st.sd)}</th>`).join("")+"</tr>";wireITH(id,ds);}const tb=document.getElementById(`tb-${id}`);if(!tb)return;tb.innerHTML=rows.length===0?`<tr class="nor"><td colspan="${st.cols.length}">No records match</td></tr>`:rows.map(r=>"<tr>"+st.cols.map(c=>`<td>${bc(c,r[c])}</td>`).join("")+"</tr>").join("");}
// Chat
let mid=0;
const thEl=document.getElementById("thread"),esEl=document.getElementById("es"),qbEl=document.getElementById("qbar"),sbEl=document.getElementById("sb"),ciEl=document.getElementById("ci");
function app(html){const d=document.createElement("div");d.innerHTML=html;thEl.appendChild(d.firstElementChild);thEl.scrollTop=thEl.scrollHeight;}
function sendChip(chip){if(esEl.style.display!=="none"){esEl.style.display="none";qbEl.style.display="flex";}app(`<div class="msg mu"><div class="mub">${chip.label}</div></div>`);const tid=`typ${++mid}`;app(`<div class="msg mb" id="${tid}"><div class="bav">🤖</div><div class="bbd"><div class="tybub"><div class="tyd"></div><div class="tyd"></div><div class="tyd"></div><span class="tyl">fetching records…</span></div></div></div>`);setTimeout(()=>{document.getElementById(tid)?.remove();let rows=_store[chip.ds];if(chip.f)rows=rows.filter(chip.f);const tid2=`t${++mid}`;const cfg=DSC[chip.ds];const sum=cfg.sumFn(rows);IS[tid2]={rows,cols:cfg.cols,sc:null,sd:"asc",fk:null,fp:null};const tbl=buildIT(rows,cfg.cols,sum,tid2);app(`<div class="msg mb"><div class="bav">🤖</div><div class="bbd"><div class="ir"><div class="idot"></div><span class="it">${chip.intent}</span></div>${tbl}<div class="fu">${rows.length} record${rows.length!==1?"s":""} · Click headers to sort · Click stat tiles to filter</div></div></div>`);wireIT(tid2,chip.ds);},600);}
const cgEl=document.getElementById("cg");
CHIPS.forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c.label;b.addEventListener("click",()=>sendChip(c));cgEl.appendChild(b);});
CHIPS.slice(0,5).forEach(c=>{const b=document.createElement("button");b.className="qchip";b.textContent=c.label;b.addEventListener("click",()=>sendChip(c));qbEl.appendChild(b);});
function handleSend(){const t=ciEl.value.trim();if(!t)return;ciEl.value="";autoR();const tl=t.toLowerCase();const chip=CHIPS.find(c=>c.label.toLowerCase()===tl)||(tl.includes("patel")&&CHIPS.find(c=>c.label.includes("Patel")))||(tl.includes("high")&&CHIPS.find(c=>c.label.includes("High")))||(tl.includes("late")&&CHIPS.find(c=>c.label.includes("Late")))||(tl.includes("miss")&&CHIPS.find(c=>c.label.includes("Missed")))||(tl.includes("declin")&&CHIPS.find(c=>c.label.includes("declined")))||(tl.includes("incomplet")&&CHIPS.find(c=>c.label.includes("incomplete")))||(tl.includes("unassign")&&CHIPS.find(c=>c.label.includes("unassigned")))||(tl.includes("week")&&CHIPS.find(c=>c.label.includes("Weekly")))||(tl.includes("agent")&&CHIPS.find(c=>c.label==="Agent summary"))||CHIPS[0];sendChip({...chip,label:t});}
function autoR(){ciEl.style.height="auto";ciEl.style.height=Math.min(ciEl.scrollHeight,100)+"px";}
ciEl.addEventListener("input",()=>{sbEl.disabled=!ciEl.value.trim();autoR();});
ciEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}});
sbEl.addEventListener("click",handleSend);
renderDash();
</script>
</body>
</html>
