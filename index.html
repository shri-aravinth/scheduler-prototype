<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EHR Scheduler · MCP App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Geist','Söhne','Segoe UI',system-ui,sans-serif;background:#07090f;color:#e2e8f0;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:2px;}
::-webkit-scrollbar-track{background:transparent;}
input,select,button,textarea{outline:none;font-family:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slideInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid;}
.badge-dot{width:4px;height:4px;border-radius:50%;display:inline-block;flex-shrink:0;}
.chip{font-size:11px;color:#64748b;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:6px 12px;cursor:pointer;transition:all .15s;}
.chip:hover{background:rgba(99,102,241,.12);color:#6366f1;border-color:rgba(99,102,241,.3);}
.chip-sm{font-size:11px;color:#64748b;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:4px 10px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.chip-sm:hover{background:rgba(99,102,241,.12);color:#6366f1;}
.btn-icon{width:32px;height:32px;border-radius:8px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6366f1;transition:all .15s;}
.btn-icon:hover{background:rgba(99,102,241,.22);box-shadow:0 0 0 2px rgba(99,102,241,.3);}
.sort-th{cursor:pointer;user-select:none;transition:color .15s;}
.sort-th:hover{color:#e2e8f0!important;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead{position:sticky;top:0;background:#0e1118;z-index:2;}
th{padding:8px 10px;text-align:left;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;font-weight:700;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.07);}
td{padding:8px 10px;vertical-align:middle;}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:background .1s;cursor:pointer;}
tbody tr:hover{background:rgba(255,255,255,.025);}
.modal-backdrop{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);}
.modal-box{background:#0e1118;border:1px solid rgba(255,255,255,.07);border-radius:16px;width:440px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,.6);overflow:hidden;}
.summary-modal-box{background:#0e1118;border:1px solid rgba(255,255,255,.07);border-radius:16px;width:680px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.6);overflow:hidden;}
.filter-select{background:#1e2535;border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 8px;color:#e2e8f0;font-size:11px;cursor:pointer;}
.report-card{display:flex;flex-direction:column;background:#0e1118;border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:border-color .18s,box-shadow .18s,transform .18s;}
.report-card:hover{border-color:rgba(99,102,241,.4);box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateY(-1px);}
.section-header{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.025);border:none;cursor:pointer;text-align:left;}
.action-form-field{margin-bottom:12px;}
.action-form-field label{font-size:11px;color:#64748b;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px;}
.action-form-field input,.action-form-field select,.action-form-field textarea{width:100%;background:#1e2535;border:1px solid rgba(255,255,255,.07);border-radius:7px;padding:8px 10px;color:#e2e8f0;font-size:13px;font-family:inherit;}

/* ── Animations & Transitions ─────────────────────────────────── */
@keyframes fadeSlideUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes slideInRight {
  from { opacity:0; transform:translateX(18px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes modalIn {
  from { opacity:0; transform:translateY(16px) scale(.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes backdropIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes rowIn {
  from { opacity:0; transform:translateX(-6px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes tileIn {
  from { opacity:0; transform:translateY(6px) scale(.98); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* Chat message entrance */
.chat-msg { animation: fadeSlideUp .22s ease both; }

/* Dashboard attention items */

/* Report cards */
.report-card { animation: tileIn .2s ease both; transition: transform .15s, box-shadow .15s, border-color .15s !important; }
.report-card:nth-child(1) { animation-delay:.04s; }
.report-card:nth-child(2) { animation-delay:.08s; }
.report-card:nth-child(3) { animation-delay:.12s; }
.report-card:nth-child(4) { animation-delay:.16s; }
.report-card:hover { transform:translateY(-2px)!important; box-shadow:0 6px 24px rgba(0,0,0,.35)!important; border-color:rgba(99,102,241,.4)!important; }

/* Summary modal */
.modal-backdrop { animation: backdropIn .18s ease both; }
.summary-modal-box { animation: modalIn .22s cubic-bezier(.16,1,.3,1) both; }

/* Action items in modal */
.summary-modal-box > div > div { animation: fadeSlideUp .16s ease both; }

/* Table rows */
tbody tr { transition: background .1s; }
tbody tr:hover { background: rgba(99,102,241,.06) !important; }

/* Tile filter buttons */
.tile-btn { transition: background .12s, border-color .12s, color .12s, transform .1s !important; }
.tile-btn:hover { transform: translateY(-1px); }

/* Sort headers */
.sort-th { transition: color .12s !important; }

/* Nav buttons */
.nav-report-btn, .summary-nav-btn { transition: background .12s, border-color .12s, opacity .12s !important; }

/* Section toggles in attention cards */
.section-header { transition: background .12s !important; }

/* Col panel slide-in */
#col-panel { animation: slideInRight .18s ease both; }

/* Urgency banner */

/* Dashboard welcome section */
</style>

function serverCall(name, args) {
  switch(name) {
        case "get_agent_summary_report": {
      let r = [..._store.agentSummary];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      if (args.reqEval)     r = r.filter(x => x.reqEval === args.reqEval);
      if (args.active)      r = r.filter(x => x.active === args.active);
      return { total:r.length, summary:{total:r.length,pending:r.filter(x=>x.visitStatus==="Pending").length,checkedOut:r.filter(x=>x.visitStatus==="Checked Out").length,medicare:r.filter(x=>x.payorType==="Medicare").length,medicaid:r.filter(x=>x.payorType==="Medicaid").length,reqEval:r.filter(x=>x.reqEval==="Y").length,inactive:r.filter(x=>x.active==="N").length}, records:r };
    }
        case "get_agent_summary_weekly": {
      let r = [..._store.weeklyVisits];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      return { summary:{total:r.length,late:r.filter(x=>x.visitStatus==="Late").length,paused:r.filter(x=>x.visitStatus==="Paused").length,incomplete:r.filter(x=>x.visitStatus==="Incomplete").length,almostComplete:r.filter(x=>x.visitStatus==="Almost Complete").length,medicare:r.filter(x=>x.payorType==="Medicare").length,medicaid:r.filter(x=>x.payorType==="Medicaid").length}, records:r };
    }
        case "get_scheduling_requests": {
      let r = [..._store.schedulingRequests];
      if (args.clientId)       r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)     r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.branchName)     r = r.filter(x => x.branchName === args.branchName);
      if (args.team)           r = r.filter(x => x.team === args.team);
      if (args.serviceCode)    r = r.filter(x => x.serviceCode === args.serviceCode);
      if (args.serviceLine)    r = r.filter(x => x.serviceLine === args.serviceLine);
      // requestStatus is the canonical status field for SR records
      if (args.requestStatus)  r = r.filter(x => x.requestStatus === args.requestStatus);
      // also accept visitStatus key for backwards-compat (filter dropdowns still use it)
      if (args.visitStatus)    r = r.filter(x => x.requestStatus === args.visitStatus);
      {
        const today=new Date(); today.setHours(0,0,0,0);
        const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
        return { total:r.length, summary:{
          total:       r.length,
          unscheduled: r.filter(x=>x.requestStatus==="Unscheduled").length,
          openShifts:  r.filter(x=>(x.openShifts||0)>0).length,
          srToday:     r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d.getTime()===today.getTime(); }).length,
          srThisWeek:  r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d>=sun && d<today; }).length,
          srOverdue:   r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d<sun; }).length,
        }, records:r };
      }
    }
        case "get_client_schedule_report": {
      let r = [..._store.clientSchedule];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      if (args.followUpRequired !== undefined) r = r.filter(x => x.followUpRequired === args.followUpRequired);
      return { summary:{total:r.length,missed:r.filter(x=>x.visitStatus==="Missed").length,declined:r.filter(x=>x.visitStatus==="Declined").length,rescheduled:r.filter(x=>x.visitStatus==="Rescheduled").length,reassigned:r.filter(x=>x.visitStatus==="Reassigned").length,followUpPending:r.filter(x=>x.followUpRequired).length,noRebook:r.filter(x=>x.visitStatus==="Missed"&&x.followUpRequired&&!x.rebookedDate).length}, records:r };
    }
    case "log_contact_attempt": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.attempts+=1; v.lastAttempt=_ts();
      return {success:true,visitId:args.visitId,patient:v.patient,totalAttempts:v.attempts,record:v};
    }
    case "send_reminder": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      return {success:true,visitId:args.visitId,clinician:v.clinician,channel:args.channel||"App Notification",sentAt:_ts(),record:v};
    }
    case "escalate_visit": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.priority="High"; v.notes=(v.notes?v.notes+" | ":"")+"[ESCALATED "+_ts()+"]: "+(args.reason||"");
      return {success:true,visitId:args.visitId,patient:v.patient,newPriority:"High",record:v};
    }
    case "resolve_visit": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.status=args.resolution;
      return {success:true,visitId:args.visitId,patient:v.patient,resolution:args.resolution,record:v};
    }
    case "mark_visit_complete": {
      const v = _store.weeklyVisits.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.status="Completed"; v.completedDate=args.completedDate||new Date().toISOString().slice(0,10);
      return {success:true,visitId:args.visitId,patient:v.patient,completedDate:v.completedDate,record:v};
    }
    case "flag_visit_for_review": {
      const v = _store.weeklyVisits.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.flagged=true;
      return {success:true,visitId:args.visitId,patient:v.patient,urgency:args.urgency||"Routine",record:v};
    }
    case "reassign_clinician": {
      const ds=[..._store.agentSummary,..._store.weeklyVisits];
      const v=ds.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.clinician=args.newClinician;
      return {success:true,visitId:args.visitId,patient:v.patient,newClinician:args.newClinician,record:v};
    }
    case "assign_clinician": {
      const r=_store.schedulingRequests.find(r=>r.id===args.requestId);
      if (!r) return {error:"Request not found"};
      r.assignedClinician=args.clinician; r.status="Assigned";
      if (args.confirmedDate) r.preferredDate=args.confirmedDate;
      return {success:true,requestId:args.requestId,patient:r.patient,clinician:args.clinician,record:r};
    }
    case "reschedule_visit": {
      const all=[..._store.agentSummary,..._store.weeklyVisits,..._store.schedulingRequests];
      const v=all.find(r=>r.id===args.visitId);
      if (!v) return {error:"Not found"};
      v.scheduledDate=args.newDate; if (args.newTime) v.scheduledTime=args.newTime;
      return {success:true,visitId:args.visitId,patient:v.patient,newDate:args.newDate,record:v};
    }
    case "rebook_visit": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.rebookedDate=args.newDate; r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,newDate:args.newDate,record:r};
    }
    case "log_outreach": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.outreachLog.push({method:args.method,outcome:args.outcome,notes:args.notes,at:_ts()});
      if (args.outcome==="Reached") r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,outcome:args.outcome,record:r};
    }
    case "close_record": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.status="Closed"; r.closeReason=args.reason; r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,reason:args.reason,record:r};
    }
    default: return {error:"Unknown tool: "+name};
  }
}

// ─── buildAttGroups ───────────────────────────────────────────────────────────
function buildAttGroups() {
  const today = new Date(); today.setHours(0,0,0,0);
  const now = new Date();
  const isAfternoon = now.getHours() >= 12;
  const dayOfWeek = today.getDay();
  const medicareWeekStart = new Date(today); medicareWeekStart.setDate(today.getDate() - dayOfWeek);
  const todayStr = today.toISOString().slice(0,10);

  const as = serverCall("get_agent_summary_report",{});
  const wv = serverCall("get_agent_summary_weekly",{});
  const sr = serverCall("get_scheduling_requests",{});
  const cs = serverCall("get_client_schedule_report",{});

  // ── Agent Summary (today's records only) ──────────────────────────────────
  const pendingToday      = as.records.filter(r=>r.visitStatus==="Pending" && r.visitDate===todayStr);
  const checkedOutToday   = as.records.filter(r=>r.visitStatus==="Checked Out" && r.visitDate===todayStr);

  // ── Weekly Summary (past days in current week, not today) ─────────────────
  const pastThisWeek      = r => { const d=new Date(r.visitDate+"T00:00:00"); return d>=medicareWeekStart && d<today; };
  const lateVisits        = wv.records.filter(r=>r.visitStatus==="Late" && pastThisWeek(r));
  const incompleteBefore  = wv.records.filter(r=>r.visitStatus==="Incomplete" && pastThisWeek(r) && !isAfternoon);
  const incompleteAfter   = wv.records.filter(r=>r.visitStatus==="Incomplete" && pastThisWeek(r) && isAfternoon);
  const almostComplete    = wv.records.filter(r=>r.visitStatus==="Almost Complete" && pastThisWeek(r));

  // ── Scheduling Requests ───────────────────────────────────────────────────
  const srToday    = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d>=today; });
  const srThisWeek = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d>=medicareWeekStart && d<today; });
  const srOld      = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d<medicareWeekStart; });

  // ── Client Schedule ───────────────────────────────────────────────────────
  const csNeedsSchedule = cs.records.filter(r=>["Missed","Declined","Rescheduled","Reassigned"].includes(r.visitStatus||r.statusName));

  const G = (label, color, nav, rows, actions, description) =>
    rows.length && { label, color, nav, rows, actions, description };

  return [
    // Agent Summary
    G(`${pendingToday.length} pending visit${pendingToday.length>1?"s":""} today`,
      "#0ea5e9",
      {dataset:"agentSummary", filterKey:"visitStatus", filterVal:"Pending", tileFilter:"pending"},
      pendingToday,
      ["Follow Up"],
      "Follow up with the agent on each pending visit to confirm status."),

    G(`${checkedOutToday.length} checked-out visit${checkedOutToday.length>1?"s":""} today`,
      "#0ea5e9",
      {dataset:"agentSummary", filterKey:"visitStatus", filterVal:"Checked Out", tileFilter:"checkedOut"},
      checkedOutToday,
      ["Follow Up"],
      "Contact the agent to follow up on each checked-out visit and confirm current status."),

    // Weekly Summary
    G(`${lateVisits.length} late visit${lateVisits.length>1?"s":""} from earlier this week`,
      "#ef4444",
      {dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Late", tileFilter:"late"},
      lateVisits,
      ["Mark Missed"],
      "These visits are late with no resolution. Mark each as missed in the system."),

    ...( incompleteBefore.length ? [
    { label:`${incompleteBefore.length} incomplete visit${incompleteBefore.length>1?"s":""} — resolve before afternoon`,
      color:"#d97706",
      nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Incomplete", tileFilter:"incomplete"},
      rows:incompleteBefore, actions:["Resolve Before Afternoon"],
      description:"These visits must be resolved before afternoon. This is a reminder — no external action required yet." }
    ] : []),

    ...( incompleteAfter.length ? [
    { label:`${incompleteAfter.length} incomplete visit${incompleteAfter.length>1?"s":""} — past afternoon deadline`,
      color:"#dc2626",
      nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Incomplete", tileFilter:"incomplete"},
      rows:incompleteAfter, actions:["Follow Up with Agent"],
      description:"These visits are past the afternoon deadline. Contact the agent immediately to resolve." }
    ] : []),

    G(almostComplete.length ? `${almostComplete.length} almost-complete visit${almostComplete.length>1?"s":""} — HCHB ticket needed` : "",
      "#8b5cf6",
      {dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Almost Complete", tileFilter:"almostComplete"},
      almostComplete,
      ["Create HCHB Ticket"],
      "Each almost-complete visit requires a corresponding HCHB ticket to be created and closed."),

    // ── Paused visits ──────────────────────────────────────────────────────
    ...(() => {
      const pausedVisits = wv.records.filter(r=>r.visitStatus==="Paused" && pastThisWeek(r));
      return pausedVisits.length ? [{
        label:`${pausedVisits.length} paused visit${pausedVisits.length>1?"s":""} from earlier this week`,
        color:"#0ea5e9",
        nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Paused", tileFilter:"paused"},
        rows:pausedVisits, actions:["Follow Up with Agent"],
        description:"Follow up with the assigned agent on each paused visit to determine next steps."
      }] : [];
    })(),

    // Scheduling Requests
    G(`${srToday.length} unscheduled request${srToday.length>1?"s":""} for today or a future date`,
      "#6366f1",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srToday,
      ["Assign to Clinician"],
      "Assign each of these requests to an available clinician as soon as possible."),

    G(`${srThisWeek.length} unscheduled request${srThisWeek.length>1?"s":""} from earlier this week`,
      "#059669",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srThisWeek,
      ["Reschedule in Week"],
      "These visits are from earlier this Medicare week and can be rescheduled within the same week."),

    G(`${srOld.length} unscheduled request${srOld.length>1?"s":""} from a previous Medicare week`,
      "#dc2626",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srOld,
      ["Mark as Missed", "Write New Order"],
      "These visits are from a prior Medicare week. Mark them as missed or write a new order to void."),

    // Client Schedule
    G(`${csNeedsSchedule.length} client visit${csNeedsSchedule.length>1?"s":""} requiring scheduling`,
      "#6366f1",
      {dataset:"clientSchedule", filterKey:"visitStatus", filterVal:"", tileFilter:""},
      csNeedsSchedule,
      ["Schedule in Console"],
      "Open the scheduling console and schedule each of these client visits."),

  ].filter(Boolean);
}

function handleAttentionQuery() {
  const as=_store.agentSummary, sr=_store.schedulingRequests, cs=_store.clientSchedule, wv=_store.weeklyVisits;
  const checkedOut=as.filter(r=>r.visitStatus==="Checked Out");
  const reqEvalPending=as.filter(r=>r.reqEval==="Y");
  const unscheduledReqEval=sr.filter(r=>r.requestStatus==="Unscheduled"&&r.reqEval==="Y");
  const missedNoRebook=cs.filter(r=>r.visitStatus==="Missed"&&r.followUpRequired&&!r.rebookedDate);
  const lateVisits=wv.filter(r=>r.visitStatus==="Late");
  const sections=[];
  if (checkedOut.length) sections.push({label:"🚨 Checked-Out Visits",color:"#dc2626",rows:checkedOut,dataset:"agentSummary",note:`${checkedOut.length} visit${checkedOut.length>1?"s":""} are checked out and require follow-up.`});
  if (reqEvalPending.length) sections.push({label:"📋 Evaluation Sign-Off Pending",color:"#22d3ee",rows:reqEvalPending,dataset:"agentSummary",note:`${reqEvalPending.length} visit${reqEvalPending.length>1?"s":""} require evaluation sign-off.`});
  if (unscheduledReqEval.length) sections.push({label:"📨 Unscheduled — Eval Required",color:"#d97706",rows:unscheduledReqEval,dataset:"schedulingRequests",note:`${unscheduledReqEval.length} request${unscheduledReqEval.length>1?"s":""} are unscheduled and need evaluation.`});
  if (missedNoRebook.length) sections.push({label:"🔁 Missed — No Rebook Scheduled",color:"#dc2626",rows:missedNoRebook,dataset:"clientSchedule",note:`${missedNoRebook.length} client${missedNoRebook.length>1?"s":""} missed their visit with no rebook on file.`});
  if (lateVisits.length) sections.push({label:"📅 Late Visits This Week",color:"#d97706",rows:lateVisits,dataset:"weeklyVisits",note:`${lateVisits.length} visit${lateVisits.length>1?"s":""} are running late and may need follow-up.`});
  const total=checkedOut.length+reqEvalPending.length+unscheduledReqEval.length+missedNoRebook.length+lateVisits.length;
  const summaryLine=total===0?"Everything looks good — no urgent actions outstanding.":`${total} item${total>1?"s":""} across ${sections.length} categor${sections.length>1?"ies":"y"} need your attention today.`;
  return {type:"attention",sections,summaryLine,intent:"Action Summary"};
}

function handleReport(tool, args, ds, intent, tileFilter) {
  const result = serverCall(tool, args);
  return {type:"table", dataset:ds, columns:RC[ds].cols, rows:result.records||[], summary:result.summary||null, intent};
}

function sendChip(text) {
  if (state.busy) return;
  state.busy=true;
  addMsg({role:"user",text});
  addMsg({role:"typing",id:"typing-msg"});
  renderChatOnly();

  setTimeout(()=>{
    removeTyping();
    const handler=CHIP_ROUTING[text];
    let result;
    if (handler) {
      result=handler();
    } else {
      result={type:"raw",text:"I can only respond to the suggested messages. Please use one of the chips below."};
    }
    addMsg({role:"assistant",...result});
    state.busy=false;
    renderChatOnly();
    scrollThread();
  }, 400);
}

// ── Smart partial re-renders (avoid full DOM wipe + scroll jump) ──────────────
function renderRightPaneOnly() {
  const rp = document.getElementById("right-pane");
  if (!rp) { renderApp(); return; }
  // Save scroll positions of ALL scrollable descendants
  const scrollMap = [];
  rp.querySelectorAll("*").forEach(el => {
    if (el.scrollTop > 0) scrollMap.push({ id: el.id, cls: el.className, scrollTop: el.scrollTop });
  });
  // Replace only the right pane
  const tmp = document.createElement("div");
  tmp.innerHTML = renderRightPane();
  const newRp = tmp.firstElementChild;
  rp.replaceWith(newRp);
  bindAll();
  // Restore scroll positions by matching id or className
  scrollMap.forEach(({ id, cls, scrollTop }) => {
    const el = id
      ? document.getElementById(id)
      : document.getElementById("right-pane")?.querySelector(`.${cls.trim().split(" ")[0]}`);
    if (el) el.scrollTop = scrollTop;
  });
}

function renderChatOnly() {
  const ct = document.getElementById("chat-thread");
  if (!ct) { renderApp(); return; }
  // Save chat scroll position
  const scrollTop = ct.scrollTop;
  ct.innerHTML = renderThread();
  bindAll();
  // Restore chat scroll (don't snap to bottom — user is reading)
  ct.scrollTop = scrollTop;
}

      <span style="font-size:10px;font-weight:700;color:${MUT};text-transform:uppercase;letter-spacing:.8px;">Chat</span>
      <button id="expand-chat" class="btn-icon" title="${isExpanded?"Restore split":"Expand chat"}">
        ${isExpanded?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/><polyline points="20 18 14 12 20 6"/></svg>`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/><polyline points="4 18 10 12 4 6"/></svg>`}
      </button>
    </div>
    <div id="chat-thread" style="flex:1;overflow-y:auto;padding:16px 16px 0;">${renderThread()}</div>
    <div style="padding:5px 10px;display:flex;gap:5px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;scrollbar-width:none;">
      <button class="chip-sm send-chip" data-chip="What needs attention today?">🔍 Attention</button>
      <button class="chip-sm send-chip" data-chip="Agent summary">📋 Agent Summary</button>
      <button class="chip-sm send-chip" data-chip="Weekly summary">📅 Weekly Summary</button>
      <button class="chip-sm send-chip" data-chip="Scheduling requests">📨 Scheduling Requests</button>
      <button class="chip-sm send-chip" data-chip="Client schedule">🔁 Client Schedule</button>
    </div>
    <div style="padding:10px 12px 12px;border-top:1px solid ${BRD};background:rgba(14,17,24,.95);flex-shrink:0;">
      <div style="background:rgba(255,255,255,.04);border:1px solid ${BRD};border-radius:12px;padding:10px 14px;text-align:center;">
        <p style="font-size:12px;color:${MUT};margin:0;">Select a suggested message above to ask the assistant</p>
      </div>
    </div>
  </div>`;
}

function renderThread() {
  if (state.thread.length===0) {
    return `
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:32px;">
      <div style="width:52px;height:52px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 32px rgba(99,102,241,.25);">🏥</div>
      <div style="text-align:center;max-width:320px;">
        <h2 style="font-size:17px;font-weight:800;color:${TXT};letter-spacing:-.4px;margin-bottom:6px;">EHR Scheduling Assistant</h2>
        <p style="color:${MUT};font-size:12px;line-height:1.7;">Click any suggestion below to get started. Results render as live UI — click any row for actions.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:360px;">
        <button class="chip send-chip" data-chip="What needs attention today?">🔍 What needs attention today?</button>
        <button class="chip send-chip" data-chip="Agent summary">📋 Agent Summary</button>
        <button class="chip send-chip" data-chip="Weekly summary">📅 Weekly Summary</button>
        <button class="chip send-chip" data-chip="Scheduling requests">📨 Scheduling Requests</button>
        <button class="chip send-chip" data-chip="Client schedule">🔁 Client Schedule</button>
      </div>
    </div>
    <div id="thread-end"></div>`;
  }
  return state.thread.map(msg=>renderMsg(msg)).join("")+`<div id="thread-end"></div>`;
}

function renderMsg(msg) {
  if (msg.role==="user") return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;animation:fadeUp .2s ease;">
      <div style="background:linear-gradient(135deg,#4f46e5,#6d28d9);border-radius:14px 14px 3px 14px;padding:9px 14px;max-width:80%;box-shadow:0 4px 14px rgba(99,102,241,.2);">
        <p style="font-size:13px;color:#fff;line-height:1.6;margin:0;">${esc(msg.text)}</p>
      </div>
    </div>`;

  if (msg.role==="typing") return `
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;">
      <div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;">🤖</div>
      <div style="background:rgba(255,255,255,.04);border:1px solid ${BRD};border-radius:3px 14px 14px 14px;padding:10px 14px;display:flex;gap:5px;align-items:center;">
        ${[0,1,2].map(i=>`<span style="width:6px;height:6px;border-radius:50%;background:${ACC};display:inline-block;animation:blink 1.3s ${i*.22}s infinite;"></span>`).join("")}
        <span style="font-size:11px;color:${MUT};margin-left:4px;font-family:monospace;">processing…</span>
      </div>
    </div>`;

  if (msg.role==="assistant") {
    let content="";
    if (msg.intent) content+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;"><span style="width:4px;height:4px;border-radius:50%;background:${ACC};display:inline-block;"></span><span style="font-size:10px;font-weight:700;color:${ACC};text-transform:uppercase;letter-spacing:.8px;">${esc(msg.intent)}</span></div>`;
    if (msg.type==="attention") content+=renderActionSummary(msg);

    if (msg.type==="table") content+=renderTableMsg(msg);
    if (msg.type==="action-result") content+=renderActionResult(msg);
    if (msg.type==="raw") content+=`<pre style="color:#94a3b8;font-size:11px;white-space:pre-wrap;background:rgba(255,255,255,.03);padding:10px;border-radius:8px;border:1px solid ${BRD};">${esc(msg.text)}</pre>`;
    if (msg.followUp) content+=`<div style="font-size:11px;color:${MUT};margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05);">${esc(msg.followUp)}</div>`;
    return `
    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:flex-start;animation:fadeUp .2s ease;">
      <div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;">🤖</div>
      <div style="flex:1;min-width:0;">${content}</div>
    </div>`;
  }
  return "";
}

function renderActionSummary(msg) {
  const sections = msg.sections || [];

  let html = `<p style="font-size:12.5px;color:#cbd5e1;line-height:1.6;margin:0 0 10px;">${esc(msg.summaryLine)}</p>`;
  if (sections.length === 0) return html;

  html += `<div style="display:flex;flex-direction:column;gap:6px;">`;

  sections.forEach((sec, si) => {
    const c       = sec.color || "#6366f1";
    const openKey = (msg._id||"att") + "-" + si;
    const isOpen  = !!state.sectionOpenState[openKey];

    // Which cols to show — use DEFAULT_VISIBLE for the dataset
    const dv   = DEFAULT_VISIBLE[sec.dataset] || RC[sec.dataset]?.cols || [];
    const cols = dv.slice(0, 8); // cap at 8 for readability in chat

    html += `
    <div style="border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.012);">

      <!-- Header row -->
      <div style="display:flex;align-items:stretch;">
        <div style="width:3px;background:${c};flex-shrink:0;"></div>
        <div style="flex:1;padding:9px 12px;min-width:0;">
          <div style="display:flex;align-items:center;gap:7px;">
            <span style="font-size:11.5px;font-weight:700;color:#e2e8f0;flex:1;line-height:1.3;">${esc(sec.label)}</span>
            <span style="font-size:10px;font-weight:700;color:${c};background:${c}22;border-radius:10px;padding:1px 7px;flex-shrink:0;">${sec.rows.length}</span>
            <!-- Toggle button -->
            <button class="section-toggle"
              data-msgid="${msg._id||"att"}"
              data-si="${si}"
              style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;font-size:10px;font-weight:600;border-radius:20px;border:1.5px solid ${c}55;background:${isOpen ? c+"28" : c+"12"};color:${c};cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;flex-shrink:0;"
              onmouseenter="this.style.background='${c}28';this.style.borderColor='${c}99';"
              onmouseleave="this.style.background='${isOpen ? c+"28" : c+"12"}';this.style.borderColor='${c}55';">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transition:transform .18s;transform:${isOpen?"rotate(180deg)":"rotate(0deg)"}"><polyline points="6 9 12 15 18 9"/></svg>
              ${isOpen ? "Hide" : "View report"}
            </button>
          </div>
          ${!isOpen && (sec.description||sec.note) ? `<p style="font-size:10.5px;color:#64748b;margin:4px 0 0;line-height:1.45;">${esc(sec.description||sec.note)}</p>` : ""}
        </div>
      </div>

      <!-- Collapsible table -->
      ${isOpen ? `
      <div style="border-top:1px solid rgba(255,255,255,.06);">
        ${sec.description||sec.note ? `<div style="padding:5px 12px 6px;font-size:10.5px;color:#64748b;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.45;">${esc(sec.description||sec.note)}</div>` : ""}
        <div style="overflow-x:auto;max-height:260px;overflow-y:auto;">
          <table>
            <thead><tr>
              ${cols.map(c2=>`<th style="white-space:nowrap;">${clbl(c2)}</th>`).join("")}
              <th style="color:${MUT};white-space:nowrap;min-width:140px;">Actions</th>
            </tr></thead>
            <tbody>
              ${sec.rows.length===0
                ? `<tr><td colspan="${cols.length+1}" style="padding:20px;text-align:center;color:${MUT};">No records</td></tr>`
                : sec.rows.map(row=>`<tr>
                    ${cols.map(col=>`<td>${cell(col,row[col])}</td>`).join("")}
                    <td style="padding:5px 8px;vertical-align:middle;">${renderActionBtns(sec.dataset,row,true)}</td>
                  </tr>`).join("")
              }
            </tbody>
          </table>
        </div>
      </div>` : ""}

    </div>`;
  });

  html += `</div>`;
  return html;
}

function renderTableMsg(msg) {
  const ds      = msg.dataset;
  const msgId   = msg._id || "msg";
  // Per-message tile filter (independent of right-pane tileFilter)
  const activeTile = state.msgTileFilter[msgId] || null;

  // Respect user column config (DEFAULT_VISIBLE + any customisations)
  const cfg  = ds ? getColCfg(ds) : null;
  const cols = cfg
    ? cfg.cols.filter(c => !cfg.hidden.has(c))
    : (msg.columns || RC[ds]?.cols || []);

  const allRows  = msg.rows || [];
  // Apply tile filter if active
  const rows = activeTile && TILE_META[activeTile]
    ? allRows.filter(TILE_META[activeTile].pred)
    : allRows;

  if (allRows.length===0) return `<div style="padding:20px;text-align:center;color:${MUT};font-size:12px;background:rgba(255,255,255,.02);border:1px solid ${BRD};border-radius:10px;">No records found</div>`;

  // Build tile bar from summary keys that exist in TILE_META
  const summary   = msg.summary || {};
  const tileEntries = Object.entries(summary).filter(([k,v]) => k!=="total" && typeof v==="number" && TILE_META[k]);
  const tileBar = tileEntries.length ? `
    <div style="display:flex;gap:5px;padding:7px 10px;border-bottom:1px solid ${BRD};background:${SURF};flex-shrink:0;overflow-x:auto;align-items:stretch;">
      ${tileEntries.map(([k,v]) => {
        const m = TILE_META[k];
        const active = activeTile === k;
        return `<button class="tile-btn msg-tile-btn" data-key="${k}" data-msgid="${msgId}"
          style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 12px 6px;border-radius:7px;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s;min-width:60px;border:1px solid ${active?m.color+"55":"rgba(255,255,255,.06)"};background:${active?m.color+"18":"rgba(255,255,255,.025)"};">
          <span style="font-size:17px;font-weight:800;color:${active?m.color:"#e2e8f0"};font-family:monospace;line-height:1;">${v}</span>
          <span style="font-size:9px;font-weight:600;color:${active?m.color:"#64748b"};text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">${m.label}</span>
        </button>`;
      }).join("")}
      ${activeTile ? `<button class="msg-tile-clear" data-msgid="${msgId}" style="font-size:10px;color:${MUT};background:none;border:1px solid ${BRD};border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit;flex-shrink:0;align-self:center;">✕ Clear</button>` : ""}
    </div>` : "";

  const hasActions = ds && rows.some(r => getRowActions(ds, r).length > 0);
  return `
  <div style="border:1px solid ${BRD};border-radius:10px;overflow:hidden;">
    ${tileBar}
    <div style="overflow-x:auto;max-height:260px;">
      <table>
        <thead><tr>
          ${cols.map(c=>`<th>${clbl(c)}</th>`).join("")}
          ${hasActions?`<th style="color:${MUT};white-space:nowrap;min-width:140px;">Actions</th>`:""}
        </tr></thead>
        <tbody>
          ${rows.length===0
            ? `<tr><td colspan="${cols.length + (hasActions?1:0)}" style="padding:20px;text-align:center;color:${MUT};">No records match filter</td></tr>`
            : rows.map(row=>`<tr>
                ${cols.map(c=>`<td>${cell(c,row[c])}</td>`).join("")}
                ${hasActions?`<td style="padding:5px 8px;vertical-align:middle;">${renderActionBtns(ds,row,true)}</td>`:""}
              </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderSummaryCards(summary) {
  const entries=Object.entries(summary).filter(([k])=>k!=="total"&&typeof summary[k]==="number");
  if (!entries.length) return "";
  return `<div style="display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid ${BRD};background:${SURF};overflow-x:auto;">${entries.map(([k,v])=>`<div style="display:flex;flex-direction:column;align-items:center;padding:6px 12px;background:rgba(255,255,255,.03);border:1px solid ${BRD};border-radius:8px;min-width:60px;flex-shrink:0;"><span style="font-size:16px;font-weight:800;color:${TXT}">${v}</span><span style="font-size:9px;color:${MUT};text-transform:uppercase;letter-spacing:.7px;margin-top:2px;">${clbl(k)}</span></div>`).join("")}</div>`;
}

function renderActionResult(msg) {
  const r=msg.result||{};
  const ok=!r.error;
  const p=ok?{bg:"rgba(16,185,129,.1)",border:"rgba(16,185,129,.25)",text:"#34d399"}:{bg:"rgba(239,68,68,.1)",border:"rgba(239,68,68,.25)",text:"#f87171"};
  const rec=r.record||{};
  const title=r.error||(msg.mode||"action").replace(/_/g," ")+" — done";
  let html=`<div style="border-radius:10px;border:1px solid ${p.border};overflow:hidden;">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:${p.bg};">
      <span style="font-size:15px;">${ok?"✓":"✗"}</span>
      <span style="font-weight:700;font-size:13px;color:${p.text};">${esc(title)}</span>
      ${rec.id?`<span style="font-size:11px;color:${p.text};opacity:.7;font-family:monospace;margin-left:auto;">${rec.id}</span>`:""}
    </div>`;
  const fields=["patient","clinician","visitType","scheduledDate","status","priority","attempts"].filter(k=>rec[k]!==undefined);
  if (fields.length>0) {
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr;">`;
    fields.forEach(k=>{
      html+=`<div style="padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:8px;align-items:center;"><span style="font-size:10px;color:${MUT};text-transform:uppercase;letter-spacing:.7px;flex-shrink:0;width:72px;">${clbl(k)}</span>${cell(k,rec[k])}</div>`;
    });
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}


function renderRightPane() {
  const isExpanded=state.paneExpand==="right";
  return `
  <div id="right-pane" style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 10px;height:36px;border-bottom:1px solid ${BRD};background:${SURF};flex-shrink:0;">
      <button id="expand-right" class="btn-icon" title="${isExpanded?"Restore split":"Expand reports"}">
        ${isExpanded?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/><polyline points="4 18 10 12 4 6"/></svg>`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/><polyline points="20 18 14 12 20 6"/></svg>`}
      </button>
      <span style="font-size:10px;font-weight:700;color:${MUT};text-transform:uppercase;letter-spacing:.8px;">Reports</span>
    </div>
    ${state.activeDs==="dashboard"?renderDashboard():renderReportView()}
  </div>`;
}

function renderDashboard() {
  const now=new Date();
  const ist=new Date(now.getTime()+5.5*60*60000+now.getTimezoneOffset()*60000);
  const h=ist.getHours();
  const greeting=h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night";
  const dateStr=ist.toLocaleDateString("en-IN",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"Asia/Kolkata"});
  const timeStr=ist.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"})+" IST";

  // Report cards data
  const as=serverCall("get_agent_summary_report",{});
  const wv=serverCall("get_agent_summary_weekly",{});
  const sr=serverCall("get_scheduling_requests",{});
  const cs=serverCall("get_client_schedule_report",{});

  const reportLinks=[
    {id:"agentSummary",icon:"📋",label:"Agent Summary",desc:"Pending visits requiring follow-up, escalation, or scheduling action.",stats:[{label:"Pending",value:as.records.filter(r=>r.visitStatus==="Pending").length,color:"#fbbf24"},{label:"Checked Out",value:as.records.filter(r=>r.visitStatus==="Checked Out").length,color:"#f87171"},{label:"Req. Eval",value:as.records.filter(r=>r.reqEval==="Y").length,color:"#22d3ee"}],urgency:as.records.filter(r=>r.visitStatus==="Checked Out").length>0?"high":as.total>0?"medium":"clear"},
    {id:"weeklyVisits",icon:"📅",label:"Weekly Summary",desc:"All visits from the current week — completed, late, and incomplete.",stats:[{label:"Late",value:wv.summary?.late||0,color:"#f87171"},{label:"Paused",value:wv.summary?.paused||0,color:"#60a5fa"},{label:"Incomplete",value:wv.summary?.incomplete||0,color:"#fbbf24"}],urgency:(wv.summary?.late||0)>0?"high":(wv.summary?.incomplete||0)>0?"medium":"clear"},
    {id:"schedulingRequests",icon:"📨",label:"Scheduling Requests",desc:"New visit requests and reschedules awaiting clinician assignment.",stats:[{label:"Unscheduled",value:sr.records.filter(r=>r.requestStatus==="Unscheduled").length,color:"#fbbf24"},{label:"Open Shifts",value:sr.records.filter(r=>(r.openShifts||0)>0).length,color:"#60a5fa"},{label:"Overdue",value:sr.records.filter(r=>{const d=new Date((r.shiftDate||"")+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);const sun=new Date(t);sun.setDate(t.getDate()-t.getDay());return d<sun;}).length,color:"#f87171"}],urgency:sr.records.filter(r=>r.requestStatus==="Unscheduled").length>0?"high":sr.total>0?"medium":"clear"},
    {id:"clientSchedule",icon:"🔁",label:"Client Schedule",desc:"Missed, declined, and rescheduled visits needing outreach or rebooking.",stats:[{label:"Follow-up req.",value:cs.summary?.followUpPending||0,color:"#a78bfa"},{label:"Missed",value:cs.summary?.missed||0,color:"#f87171"},{label:"Declined",value:cs.summary?.declined||0,color:"#fbbf24"}],urgency:(cs.summary?.followUpPending||0)>0?"high":"clear"},
  ];
  const urgColor={high:"#dc2626",medium:"#d97706",clear:"#34d399"};

  // Attention groups
  const attGroups = buildAttGroups();
  const totalAlerts = attGroups.reduce((s,g)=>s+g.rows.length,0);

  return `
  <div style="flex:1;display:flex;flex-direction:column;overflow-y:auto;background:${BG};">

    <!-- Greeting -->
    <div style="padding:28px 28px 24px;background:linear-gradient(160deg,rgba(99,102,241,.08) 0%,rgba(139,92,246,.04) 50%,transparent 100%);border-bottom:1px solid ${BRD};flex-shrink:0;">
      <div style="font-size:11px;color:${MUT};letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
        <span>${dateStr}</span><span style="opacity:.3">·</span><span>${timeStr}</span>
      </div>
      <div style="font-size:28px;font-weight:800;color:${TXT};letter-spacing:-.8px;line-height:1.1;">
        ${greeting}, <span style="background:linear-gradient(90deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${esc(state.username)}</span> 👋
      </div>
    </div>

    <!-- Attention section -->
    ${attGroups.length>0?`
    <div style="margin:16px 24px 0;border:1px solid rgba(248,113,113,.18);border-radius:12px;background:rgba(248,113,113,.03);overflow:hidden;">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(248,113,113,.12);">
        <span style="width:7px;height:7px;border-radius:50%;background:#f87171;display:inline-block;flex-shrink:0;animation:pulse 2s infinite;"></span>
        <span style="font-size:11.5px;font-weight:700;color:#fca5a5;flex:1;">
          ${totalAlerts} item${totalAlerts>1?"s":""} need${totalAlerts===1?"s":""} your attention
        </span>
      </div>
      <ul style="margin:0;padding:10px 14px 12px;list-style:none;display:flex;flex-direction:column;gap:6px;">
        ${attGroups.map(g=>`
        <li style="display:flex;align-items:center;gap:9px;animation:rowIn .18s ease both;">
          <span style="width:5px;height:5px;border-radius:50%;background:${g.color};flex-shrink:0;"></span>
          <span style="font-size:12px;color:${TXT};flex:1;line-height:1.4;">${esc(g.label)}</span>
          <span style="font-size:10px;font-weight:700;color:${g.color};background:${g.color}18;border-radius:8px;padding:1px 7px;flex-shrink:0;">${g.rows.length}</span>
          <button class="nav-report-btn"
            data-dataset="${g.nav.dataset}"
            data-filterkey="${g.nav.filterKey||""}"

// ─── Row Action Logic ─────────────────────────────────────────────────────────
function getRowActions(ds, row) {
  const today = new Date(); today.setHours(0,0,0,0);
  const visitDt = row.visitDate ? new Date(row.visitDate + "T00:00:00") : null;
  const now = new Date();
  const isAfternoon = now.getHours() >= 12;
  // Medicare week: Sunday–Saturday. Find start of current Medicare week (Sunday)
  const dayOfWeek = today.getDay(); // 0=Sun
  const medicareWeekStart = new Date(today); medicareWeekStart.setDate(today.getDate() - dayOfWeek);
  const prevMedicareWeekStart = new Date(medicareWeekStart); prevMedicareWeekStart.setDate(medicareWeekStart.getDate() - 7);

  const btn = (label, color="#6366f1", outline=false, nonClickable=false) => ({label, color, outline, nonClickable});

  if (ds === "agentSummary") {
    if (row.visitStatus === "Pending")      return [btn("Follow Up","#d97706")];
    if (row.visitStatus === "Checked Out")  return [btn("Follow Up","#d97706")];
    return [];
  }

  if (ds === "weeklyVisits") {
    const isPast = visitDt && visitDt < today;
    if (!isPast) return [];
    if (row.visitStatus === "Late")         return [btn("Mark Missed","#dc2626")];
    if (row.visitStatus === "Incomplete") {
      return isAfternoon
        ? [btn("Follow Up with Agent","#d97706")]
        : [btn("Resolve Before Afternoon","#64748b",false,true)];
    }
    if (row.visitStatus === "Almost Complete") return [btn("Create HCHB Ticket","#6366f1")];
    if (row.visitStatus === "Paused")           return [btn("Follow Up with Agent","#d97706")];
    return [];
  }

  if (ds === "schedulingRequests") {
    const srDt = row.shiftDate ? new Date(row.shiftDate + "T00:00:00")
               : row.visitDate ? new Date(row.visitDate + "T00:00:00")
               : null;
    if (!srDt) return [];
    if (srDt >= today) return [btn("Assign to Clinician","#06b6d4")];
    if (srDt >= medicareWeekStart) return [btn("Reschedule in Week","#f59e0b")];
    return [btn("Mark as Missed","#ef4444"), btn("Write New Order","#f97316",true)];
  }

  if (ds === "clientSchedule") {
    if (["Missed","Declined","Rescheduled","Reassigned"].includes(row.visitStatus||row.statusName))
      return [btn("Schedule in Console","#6366f1")];
    return [];
  }

  return [];
}

          const active=state.tileFilter===k;
          return `<button class="tile-btn" data-key="${k}"
            style="display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 14px 8px;border-radius:8px;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s;min-width:72px;border:1px solid ${active?m.color+"55":"rgba(255,255,255,.06)"};background:${active?m.color+"18":"rgba(255,255,255,.025)"};">
            <span style="font-size:20px;font-weight:800;color:${active?m.color:"#e2e8f0"};font-family:monospace;line-height:1;">${v}</span>
            <span style="font-size:9px;font-weight:600;color:${active?m.color:"#64748b"};text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;">${m.label}</span>
          </button>`;
        }).join("")}
        ${state.tileFilter?`<button id="tile-clear" style="font-size:10px;color:${MUT};background:none;border:1px solid ${BRD};border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;flex-shrink:0;align-self:center;">✕ Clear</button>`:""}
      </div>`;
    })()}
    <div style="flex:1;overflow-y:auto;overflow-x:auto;">
      ${(()=>{const activeCols=getActiveCols();const hasActions=tileRows.some(r=>getRowActions(state.activeDs,r).length>0);return `<table>
        <thead><tr>
          ${activeCols.map(c=>`<th class="sort-th" data-col="${c}" style="color:${state.sortCol===c?ACC:MUT};">${clbl(c)}${state.sortCol===c?`<span style="margin-left:3px;">${state.sortDir==="asc"?"↑":"↓"}</span>`:""}</th>`).join("")}
          ${hasActions?`<th style="color:${MUT};white-space:nowrap;min-width:160px;">Actions</th>`:""}
        </tr></thead>
        <tbody>
          ${tileRows.length===0?`<tr><td colspan="${activeCols.length+2}" style="padding:32px;text-align:center;color:${MUT};">No records match</td></tr>`:""}
          ${tileRows.map(row=>{const ab=renderActionBtns(state.activeDs,row);return `<tr>
            ${activeCols.map(c=>`<td>${cell(c,row[c])}</td>`).join("")}
            ${hasActions?`<td style="padding:7px 10px 7px 4px;vertical-align:middle;">${ab}</td>`:""}
          </tr>`;}).join("")}
        </tbody>
      </table>`;})()}
    </div>
    ${state.colPanelOpen ? renderColPanel() : ""}
  </div>`;
}

// ─── Summary Modal ───────────────────────────────────────────────────────────

  const groups = state.summaryGroups || [];
  const total  = groups.reduce((s,g)=>s+g.rows.length, 0);

  <div id="summary-modal-backdrop" class="modal-backdrop">
    <div class="summary-modal-box" style="max-width:580px;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid ${BRD};flex-shrink:0;">
        <div>
          <div style="font-size:15px;font-weight:700;color:${TXT};letter-spacing:-.2px;">Action Items</div>
          <div style="font-size:11px;color:${MUT};margin-top:3px;">${total} item${total!==1?"s":""} across ${groups.length} group${groups.length!==1?"s":""}</div>
        </div>
        <button id="close-summary-modal" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;color:${MUT};font-size:16px;line-height:1;padding:5px 9px;font-family:inherit;transition:background .15s;" onmouseenter="this.style.background='rgba(255,255,255,.1)';" onmouseleave="this.style.background='rgba(255,255,255,.06)';">✕</button>
      </div>
      <div style="overflow-y:auto;padding:6px 0;">
        ${groups.map((g,i)=>{
          const c = g.color;

          <div style="padding:13px 22px;border-bottom:${i<groups.length-1?"1px solid rgba(255,255,255,.04)":"none"};animation:fadeSlideUp .18s ease both;animation-delay:${i*0.04}s;">
            <div style="display:flex;align-items:flex-start;gap:11px;">
              <div style="width:3px;align-self:stretch;border-radius:2px;background:${c};flex-shrink:0;min-height:18px;"></div>
              <div style="flex:1;min-width:0;">

                <!-- Title row: label + count badge + Take me to report -->
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <span style="font-size:12.5px;font-weight:700;color:${TXT};line-height:1.35;flex:1;min-width:0;">${esc(g.label)}</span>
                  <span style="font-size:10px;font-weight:700;color:${c};background:${c}1a;border-radius:10px;padding:2px 8px;flex-shrink:0;white-space:nowrap;">${g.rows.length}</span>
                  <button class="summary-nav-btn"
                    data-dataset="${g.nav.dataset}"
                    data-filterkey="${g.nav.filterKey||''}"
                    data-filterval="${g.nav.filterVal||''}"
                    data-tilefilter="${g.nav.tileFilter||''}"
                    style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;font-size:10px;font-weight:600;border-radius:20px;border:1.5px solid ${c}55;background:${c}12;color:${c};cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;transition:background .15s,border-color .15s;"
                    onmouseenter="this.style.background='${c}28';this.style.borderColor='${c}99';"
                    onmouseleave="this.style.background='${c}12';this.style.borderColor='${c}55';">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Take me to report
                  </button>
                </div>

                <!-- Description only -->
                <p style="font-size:11px;color:#64748b;margin:0;line-height:1.55;">${g.description||""}</p>

              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  </div>`;
}

// ─── Action Modal ─────────────────────────────────────────────────────────────
function renderActionModal() {
  const {record,dataset}=state.modal;
  const ACTIONS={
    agentSummary:[{label:"Log Contact",key:"log_contact_attempt",color:"#6366f1"},{label:"Send Reminder",key:"send_reminder",color:"#0891b2"},{label:"Escalate",key:"escalate_visit",color:"#ef4444"},{label:"Reassign",key:"reassign_clinician",color:"#8b5cf6"},{label:"Resolve",key:"resolve_visit",color:"#10b981"}],
    weeklyVisits:[{label:"Mark Complete",key:"mark_visit_complete",color:"#10b981"},{label:"Flag for Review",key:"flag_visit_for_review",color:"#f59e0b"},{label:"Reassign",key:"reassign_clinician",color:"#6366f1"}],
    schedulingRequests:[{label:"Assign Clinician",key:"assign_clinician",color:"#6366f1"},{label:"Reschedule",key:"reschedule_visit",color:"#0891b2"},{label:"Mark Late",key:"mark_visit_late",color:"#f59e0b"}],
    clientSchedule:[{label:"Rebook",key:"rebook_visit",color:"#6366f1"},{label:"Log Outreach",key:"log_outreach",color:"#0891b2"},{label:"Close Record",key:"close_record",color:"#64748b"}],
  };
  const actions=ACTIONS[dataset]||[];
  const selectedMode=state.actionMode||null;

  const formHtml=renderActionForm(selectedMode, record, dataset);

  return `
  <div id="action-modal-backdrop" class="modal-backdrop">
    <div class="modal-box">
      <div style="padding:16px 20px;border-bottom:1px solid ${BRD};display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:11px;color:${MUT};text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;">Actions · <span style="font-family:monospace;color:${ACC};">${record.id}</span></div>
          <div style="font-size:15px;font-weight:700;color:${TXT};">${esc(record.patient)}</div>
        </div>
        <button id="close-action-modal" style="background:none;border:none;color:${MUT};cursor:pointer;font-size:20px;line-height:1;">✕</button>
      </div>
      <div style="padding:16px 20px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:16px;padding:12px;background:${BG};border-radius:8px;border:1px solid ${BRD};">
          ${[["Clinician",record.clinician],["Type",record.visitType||record.requestType],["Status",record.status,"badge"],["Priority",record.priority,"badge"],["Date",record.scheduledDate||record.preferredDate||"—"]].map(([k,v,t])=>`
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="font-size:10px;color:${MUT};text-transform:uppercase;letter-spacing:.6px;width:60px;flex-shrink:0;">${k}</span>
            ${t==="badge"?badge(v):`<span style="font-size:12px;color:#94a3b8;">${v||"—"}</span>`}
          </div>`).join("")}
        </div>
        ${!selectedMode?`
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${actions.map(a=>`<button class="action-mode-btn" data-mode="${a.key}" style="padding:8px 14px;border-radius:8px;border:1px solid ${a.color}44;background:${a.color}14;color:${a.color};font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">${a.label}</button>`).join("")}
        </div>`:`
        <div style="background:${BG};border-radius:10px;padding:14px;border:1px solid ${BRD};">
          ${formHtml}
          <div style="display:flex;gap:8px;margin-top:14px;">
            <button id="action-back-btn" style="flex:1;padding:8px;border-radius:8px;border:1px solid ${BRD};background:none;color:${MUT};font-size:12px;cursor:pointer;font-family:inherit;">← Back</button>
            <button id="action-commit-btn" data-mode="${selectedMode}" style="flex:2;padding:8px;border-radius:8px;border:none;background:${ACC};color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Confirm</button>
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
}

function renderActionForm(mode, record, dataset) {
  if (!mode) return "";
  const fld=(label,id,type="text",opts=null)=>`
  <div class="action-form-field">
    <label>${label}</label>
    ${opts?`<select id="af-${id}"><option value="">— Select —</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select>`:`<input type="${type}" id="af-${id}" placeholder="${label}…">`}
  </div>`;
  switch(mode){
    case "log_contact_attempt": return fld("Method","method","text",["Phone","Text","Email","Portal"])+fld("Notes","notes");
    case "send_reminder": return fld("Channel","channel","text",["SMS","Email","App Notification"])+fld("Message","message");
    case "escalate_visit": return fld("Reason","reason");
    case "resolve_visit": return fld("Resolution","resolution","text",["Completed","Cancelled","No Longer Needed"])+fld("Notes","notes");
    case "reassign_clinician": return fld("New Clinician","newClinician","text",CLINICIANS)+fld("Reason","reason");
    case "mark_visit_complete": return fld("Completed Date","completedDate","date")+fld("Notes","notes");
    case "flag_visit_for_review": return fld("Urgency","urgency","text",["Routine","Urgent"])+fld("Reason","reason");
    case "assign_clinician": return fld("Clinician","clinician","text",CLINICIANS)+fld("Confirmed Date","confirmedDate","date");
    case "reschedule_visit": return fld("New Date","newDate","date")+fld("New Time","newTime","time")+fld("Reason","reason");
    case "rebook_visit": return fld("New Date","newDate","date")+fld("New Time","newTime","time")+fld("Clinician","clinician","text",CLINICIANS);
    case "log_outreach": return fld("Method","method","text",["Phone","Text","Email","Portal","In-Person"])+fld("Outcome","outcome","text",["Reached","No Answer","Left Voicemail","Wrong Number","Refused"])+fld("Notes","notes");
    case "close_record": return fld("Reason","reason","text",["Resolved","Patient Discharged","Duplicate","Error","Other"]);
    default: return fld("Notes","notes");
  }
}

// ─── Bind events ──────────────────────────────────────────────────────────────
function bindAll() {
  // Welcome
  const startBtn=document.getElementById("start-btn");
  if (startBtn) {
    const ni=document.getElementById("name-input");
    const doStart=()=>{ const n=ni?.value?.trim(); if(n){state.username=n;renderApp();} };
    startBtn.addEventListener("click",doStart);
    ni?.addEventListener("keydown",e=>{ if(e.key==="Enter") doStart(); });
  }

  // Expand/collapse panes
  document.getElementById("expand-chat")?.addEventListener("click",()=>{ state.paneExpand=state.paneExpand==="left"?null:"left"; renderApp(); });
  document.getElementById("expand-right")?.addEventListener("click",()=>{ state.paneExpand=state.paneExpand==="right"?null:"right"; renderApp(); });

  // Chips (initial + bar)
  document.querySelectorAll(".send-chip").forEach(btn=>{
    btn.addEventListener("click",()=>sendChip(btn.dataset.chip));
  });

  // Section toggles (attention summary in chat)
  document.querySelectorAll(".section-toggle").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const key=btn.dataset.msgid+"-"+btn.dataset.si;
      state.sectionOpenState[key]=!state.sectionOpenState[key];
      renderChatOnly();
    });
  });

  // Per-message tile filter buttons (in chat inline reports)
  document.querySelectorAll(".msg-tile-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=btn.dataset.msgid, k=btn.dataset.key;
      state.msgTileFilter[id] = state.msgTileFilter[id]===k ? null : k;
      renderChatOnly();
    });
  });
  document.querySelectorAll(".msg-tile-clear").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.msgTileFilter[btn.dataset.msgid]=null;
      renderChatOnly();
    });
  });



  // Nav to report
  document.querySelectorAll(".nav-ds-btn, .report-card").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.activeDs=btn.dataset.ds||btn.closest("[data-ds]")?.dataset.ds; state.filters={}; state.search=""; state.sortCol=null; state.tileFilter=null; renderApp(); });
  });

  // Nav report from attention item
  document.querySelectorAll(".nav-report-btn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const ds=btn.dataset.dataset;
      const fk=btn.dataset.filterkey;
      const fv=btn.dataset.filterval;
      const tf=btn.dataset.tilefilter||"";
      if (!ds) return;
      state.activeDs=ds;
      state.search="";
      state.sortCol=null;
      state.summaryGroups=null;
      state.filters=fk?{[fk]:fv}:{};
      state.tileFilter=tf||null;
      renderRightPaneOnly();
    });
  });



  // Summary modal close
  document.getElementById("close-summary-modal")?.addEventListener("click",()=>{ state.summaryGroups=null; renderApp(); });
  document.getElementById("summary-modal-backdrop")?.addEventListener("click",e=>{ if(e.target===e.currentTarget){state.summaryGroups=null;renderApp();} });

  // Summary modal nav buttons
  document.querySelectorAll(".summary-nav-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const ds=btn.dataset.dataset;
      const fk=btn.dataset.filterkey;
      const fv=btn.dataset.filterval;
      const tf=btn.dataset.tilefilter||"";
      state.summaryGroups=null;
      state.activeDs=ds;
      state.search="";
      state.sortCol=null;
      state.filters=fk?{[fk]:fv}:{};
      state.tileFilter=tf||null;
      renderRightPaneOnly();
    });
  });

  // Back to dashboard
  document.getElementById("back-dashboard")?.addEventListener("click",()=>{ state.activeDs="dashboard"; state.filters={}; state.search=""; renderRightPaneOnly(); });

  // Report filters
  document.querySelectorAll(".report-filter").forEach(sel=>{
    sel.addEventListener("change",()=>{ state.filters[sel.dataset.key]=sel.value; state.sortCol=null; renderRightPaneOnly(); });
  });

  // Search
  document.getElementById("report-search")?.addEventListener("input",e=>{ state.search=e.target.value; renderRightPaneOnly(); });
  document.getElementById("clear-filters")?.addEventListener("click",()=>{ state.filters={}; state.search=""; state.sortCol=null; state.tileFilter=null; renderRightPaneOnly(); });

  // Tile filter buttons
  document.querySelectorAll(".tile-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      state.tileFilter = state.tileFilter===btn.dataset.key ? null : btn.dataset.key;
      renderRightPaneOnly();
    });
  });
  document.getElementById("tile-clear")?.addEventListener("click",()=>{ state.tileFilter=null; renderRightPaneOnly(); });

  // ── Column panel ───────────────────────────────────────────────────────────
  document.getElementById("col-panel-btn")?.addEventListener("click",()=>{
    state.colPanelOpen=!state.colPanelOpen; renderRightPaneOnly();
  });

  document.getElementById("col-panel-close")?.addEventListener("click",()=>{
    state.colPanelOpen=false; renderRightPaneOnly();
  });

  document.getElementById("col-reset")?.addEventListener("click",()=>{
    const ds=state.activeDs;
    state.colConfig[ds]=null; getColCfg(ds);
    renderRightPaneOnly();
  });

  // Toggle column visibility
  document.querySelectorAll(".col-vis-btn").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const col=btn.dataset.col;
      const ds=state.activeDs;
      const cfg=getColCfg(ds);
      if (cfg.hidden.has(col)) cfg.hidden.delete(col);
      else cfg.hidden.add(col);
      renderRightPaneOnly();
    });
  });

  // Drag-to-reorder column list
  let dragSrcIdx=null;
  document.querySelectorAll(".col-item").forEach(item=>{
    item.addEventListener("dragstart",e=>{
      dragSrcIdx=parseInt(item.dataset.idx);
      e.dataTransfer.effectAllowed="move";
      item.style.opacity="0.45";
    });
    item.addEventListener("dragend",e=>{
      item.style.opacity="1";
      document.querySelectorAll(".col-item").forEach(i=>i.style.borderTop="");
    });
    item.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      document.querySelectorAll(".col-item").forEach(i=>i.style.borderTop="");
      item.style.borderTop="2px solid #6366f1";
    });
    item.addEventListener("dragleave",()=>{
      item.style.borderTop="";
    });
    item.addEventListener("drop",e=>{
      e.preventDefault();
      item.style.borderTop="";
      const dropIdx=parseInt(item.dataset.idx);
      if (dragSrcIdx===null || dragSrcIdx===dropIdx) return;
      const ds=state.activeDs;
      const cfg=getColCfg(ds);
      const cols=[...cfg.cols];
      const [moved]=cols.splice(dragSrcIdx,1);
      cols.splice(dropIdx,0,moved);
      cfg.cols=cols;
      dragSrcIdx=null;
      renderRightPaneOnly();
    });
  });

  // Sort headers
  document.querySelectorAll(".sort-th").forEach(th=>{
    th.addEventListener("click",()=>{
      if(state.sortCol===th.dataset.col) state.sortDir=state.sortDir==="asc"?"desc":"asc";
      else{state.sortCol=th.dataset.col;state.sortDir="asc";}
      renderRightPaneOnly();
    });
  });

  // Action modal


  document.querySelectorAll(".action-mode-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.actionMode=btn.dataset.mode; renderRightPaneOnly(); });
  });

  document.getElementById("action-back-btn")?.addEventListener("click",()=>{ state.actionMode=null; renderRightPaneOnly(); });

  document.getElementById("action-commit-btn")?.addEventListener("click",()=>{
    const mode=state.actionMode;
    const {record,dataset}=state.modal;
    const id=record.id;
    const gv=fid=>document.getElementById("af-"+fid)?.value||undefined;
    const args={};
    if(mode==="log_contact_attempt"){args.visitId=id;const m=gv("method"),n=gv("notes");if(m)args.method=m;if(n)args.notes=n;}
    else if(mode==="send_reminder"){args.visitId=id;const c=gv("channel"),msg=gv("message");if(c)args.channel=c;if(msg)args.message=msg;}
    else if(mode==="escalate_visit"){args.visitId=id;const r=gv("reason");if(r)args.reason=r;}
    else if(mode==="resolve_visit"){args.visitId=id;args.resolution=gv("resolution")||"Completed";const n=gv("notes");if(n)args.notes=n;}
    else if(mode==="reassign_clinician"){args.visitId=id;args.newClinician=gv("newClinician")||"";const r=gv("reason");if(r)args.reason=r;}
    else if(mode==="mark_visit_complete"){args.visitId=id;const d=gv("completedDate");if(d)args.completedDate=d;}
    else if(mode==="flag_visit_for_review"){args.visitId=id;const u=gv("urgency"),r=gv("reason");if(u)args.urgency=u;if(r)args.reason=r;}
    else if(mode==="assign_clinician"){args.requestId=id;args.clinician=gv("clinician")||"";const d=gv("confirmedDate");if(d)args.confirmedDate=d;}
    else if(mode==="reschedule_visit"){args.visitId=id;args.newDate=gv("newDate")||"";const t=gv("newTime"),r=gv("reason");if(t)args.newTime=t;if(r)args.reason=r;}
    else if(mode==="rebook_visit"){args.recordId=id;args.newDate=gv("newDate")||"";const t=gv("newTime"),c=gv("clinician");if(t)args.newTime=t;if(c)args.clinician=c;}
    else if(mode==="log_outreach"){args.recordId=id;const m=gv("method"),o=gv("outcome"),n=gv("notes");if(m)args.method=m;if(o)args.outcome=o;if(n)args.notes=n;}
    else if(mode==="close_record"){args.recordId=id;args.reason=gv("reason")||"Resolved";}

    const result=serverCall(mode,args);
    state.modal=null; state.actionMode=null;
    addMsg({role:"assistant",intent:mode.replace(/_/g," "),type:"action-result",result,mode});
    // Update right pane without resetting chat scroll
    renderRightPaneOnly();
    // Append new message to chat thread and scroll to it
    const ct=document.getElementById("chat-thread");
    if (ct) {
      ct.innerHTML=renderThread();
      bindAll();
      scrollThread();
    } else {
      renderApp();
      scrollThread();
    }
  });
}

function esc(s){ if(!s)return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ─── Boot ─────────────────────────────────────────────────────────────────────
renderApp();
</script>
</body>
</html>
