<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
input,select,button,textarea{outline:none;font-family:inherit;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Base */
body{font-family:'Geist','Inter',system-ui,sans-serif;background:#ffffff;color:#1e293b;}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap;border:1px solid;}
.badge-dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{position:sticky;top:0;z-index:2;background:#ffffff;border-bottom:0.3px solid #0f172a;}
th{padding:10px 14px;text-align:left;font-size:11px;color:#1e293b;text-transform:uppercase;letter-spacing:.8px;font-weight:700;white-space:nowrap;}
td{padding:10px 14px;vertical-align:middle;border-bottom:0.3px solid #0f172a;color:#000000;font-size:13px;}
tbody tr{transition:background .08s;cursor:pointer;}
tbody tr:hover{background:#ffffff;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);animation:backdropIn .15s ease both;}
.modal-box{border-radius:10px;width:440px;max-width:92vw;overflow:hidden;animation:modalIn .2s cubic-bezier(.16,1,.3,1) both;background:#fff;border:1px solid #e2e8f0;box-shadow:0 20px 60px rgba(0,0,0,.12);}

/* Form fields */
.aff{margin-bottom:12px;}
.aff label{font-size:11px;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px;color:#64748b;font-weight:600;}
.aff input,.aff select{width:100%;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;border:1px solid #d1d5db;color:#1e293b;}
.aff input:focus,.aff select:focus{border-color:#3b5bdb;box-shadow:0 0 0 2px rgba(59,91,219,.12);}

/* Misc */
.chat-msg{animation:fadeUp .2s ease both;}
.sort-th{cursor:pointer;user-select:none;transition:color .12s;}
.sort-th:hover{color:#3b5bdb!important;}
.chip{cursor:pointer;transition:all .12s;font-family:inherit;}

/* Suggestion chips */
.send-chip-btn{background:#ffffff;border:1px solid #94a3b8;border-radius:6px;padding:4px 12px;font-size:11px;color:#374151;cursor:pointer;font-weight:500;}
.send-chip-btn:hover{background:#eff6ff;color:#1e40af;border-color:#3b82f6;}
</style>

function serverCall(name, args) {
  switch(name) {
        case "get_agent_summary_report": {
      let r = [..._store.agentSummary];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      if (args.reqEval)     r = r.filter(x => x.reqEval === args.reqEval);
      if (args.active)      r = r.filter(x => x.active === args.active);
      return { total:r.length, summary:{total:r.length,pending:r.filter(x=>x.visitStatus==="Pending").length,checkedOut:r.filter(x=>x.visitStatus==="Checked Out").length,medicare:r.filter(x=>x.payorType==="Medicare").length,medicaid:r.filter(x=>x.payorType==="Medicaid").length,reqEval:r.filter(x=>x.reqEval==="Y").length,inactive:r.filter(x=>x.active==="N").length}, records:r };
    }
        case "get_agent_summary_weekly": {
      let r = [..._store.weeklyVisits];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      return { summary:{total:r.length,late:r.filter(x=>x.visitStatus==="Late").length,paused:r.filter(x=>x.visitStatus==="Paused").length,incomplete:r.filter(x=>x.visitStatus==="Incomplete").length,almostComplete:r.filter(x=>x.visitStatus==="Almost Complete").length,medicare:r.filter(x=>x.payorType==="Medicare").length,medicaid:r.filter(x=>x.payorType==="Medicaid").length}, records:r };
    }
        case "get_scheduling_requests": {
      let r = [..._store.schedulingRequests];
      if (args.clientId)       r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)     r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.branchName)     r = r.filter(x => x.branchName === args.branchName);
      if (args.team)           r = r.filter(x => x.team === args.team);
      if (args.serviceCode)    r = r.filter(x => x.serviceCode === args.serviceCode);
      if (args.serviceLine)    r = r.filter(x => x.serviceLine === args.serviceLine);
      // requestStatus is the canonical status field for SR records
      if (args.requestStatus)  r = r.filter(x => x.requestStatus === args.requestStatus);
      // also accept visitStatus key for backwards-compat (filter dropdowns still use it)
      if (args.visitStatus)    r = r.filter(x => x.requestStatus === args.visitStatus);
      {
        const today=new Date(); today.setHours(0,0,0,0);
        const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
        return { total:r.length, summary:{
          total:       r.length,
          unscheduled: r.filter(x=>x.requestStatus==="Unscheduled").length,
          openShifts:  r.filter(x=>(x.openShifts||0)>0).length,
          srToday:     r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d.getTime()===today.getTime(); }).length,
          srThisWeek:  r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d>=sun && d<today; }).length,
          srOverdue:   r.filter(x=>{ const d=new Date((x.shiftDate||"")+"T00:00:00"); return d<sun; }).length,
        }, records:r };
      }
    }
        case "get_client_schedule_report": {
      let r = [..._store.clientSchedule];
      if (args.visitNumber) r = r.filter(x => x.visitNumber === args.visitNumber);
      if (args.agentName)   r = r.filter(x => x.agentName.toLowerCase().includes(args.agentName.toLowerCase()));
      if (args.agentId)     r = r.filter(x => x.agentId === args.agentId);
      if (args.clientId)    r = r.filter(x => x.clientId === args.clientId);
      if (args.clientName)  r = r.filter(x => x.clientName.toLowerCase().includes(args.clientName.toLowerCase()));
      if (args.discipline)  r = r.filter(x => x.discipline === args.discipline);
      if (args.visitType)   r = r.filter(x => x.visitType.toLowerCase().includes(args.visitType.toLowerCase()));
      if (args.visitStatus) r = r.filter(x => x.visitStatus === args.visitStatus);
      if (args.payorType)   r = r.filter(x => x.payorType === args.payorType);
      if (args.branchName)  r = r.filter(x => x.branchName === args.branchName);
      if (args.team)        r = r.filter(x => x.team === args.team);
      if (args.followUpRequired !== undefined) r = r.filter(x => x.followUpRequired === args.followUpRequired);
      return { summary:{total:r.length,missed:r.filter(x=>x.visitStatus==="Missed").length,declined:r.filter(x=>x.visitStatus==="Declined").length,rescheduled:r.filter(x=>x.visitStatus==="Rescheduled").length,reassigned:r.filter(x=>x.visitStatus==="Reassigned").length,followUpPending:r.filter(x=>x.followUpRequired).length,noRebook:r.filter(x=>x.visitStatus==="Missed"&&x.followUpRequired&&!x.rebookedDate).length}, records:r };
    }
    case "log_contact_attempt": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.attempts+=1; v.lastAttempt=_ts();
      return {success:true,visitId:args.visitId,patient:v.patient,totalAttempts:v.attempts,record:v};
    }
    case "send_reminder": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      return {success:true,visitId:args.visitId,clinician:v.clinician,channel:args.channel||"App Notification",sentAt:_ts(),record:v};
    }
    case "escalate_visit": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.priority="High"; v.notes=(v.notes?v.notes+" | ":"")+"[ESCALATED "+_ts()+"]: "+(args.reason||"");
      return {success:true,visitId:args.visitId,patient:v.patient,newPriority:"High",record:v};
    }
    case "resolve_visit": {
      const v = _store.agentSummary.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.status=args.resolution;
      return {success:true,visitId:args.visitId,patient:v.patient,resolution:args.resolution,record:v};
    }
    case "mark_visit_complete": {
      const v = _store.weeklyVisits.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.status="Completed"; v.completedDate=args.completedDate||new Date().toISOString().slice(0,10);
      return {success:true,visitId:args.visitId,patient:v.patient,completedDate:v.completedDate,record:v};
    }
    case "flag_visit_for_review": {
      const v = _store.weeklyVisits.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.flagged=true;
      return {success:true,visitId:args.visitId,patient:v.patient,urgency:args.urgency||"Routine",record:v};
    }
    case "reassign_clinician": {
      const ds=[..._store.agentSummary,..._store.weeklyVisits];
      const v=ds.find(r=>r.id===args.visitId);
      if (!v) return {error:"Visit not found"};
      v.clinician=args.newClinician;
      return {success:true,visitId:args.visitId,patient:v.patient,newClinician:args.newClinician,record:v};
    }
    case "assign_clinician": {
      const r=_store.schedulingRequests.find(r=>r.id===args.requestId);
      if (!r) return {error:"Request not found"};
      r.assignedClinician=args.clinician; r.status="Assigned";
      if (args.confirmedDate) r.preferredDate=args.confirmedDate;
      return {success:true,requestId:args.requestId,patient:r.patient,clinician:args.clinician,record:r};
    }
    case "reschedule_visit": {
      const all=[..._store.agentSummary,..._store.weeklyVisits,..._store.schedulingRequests];
      const v=all.find(r=>r.id===args.visitId);
      if (!v) return {error:"Not found"};
      v.scheduledDate=args.newDate; if (args.newTime) v.scheduledTime=args.newTime;
      return {success:true,visitId:args.visitId,patient:v.patient,newDate:args.newDate,record:v};
    }
    case "rebook_visit": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.rebookedDate=args.newDate; r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,newDate:args.newDate,record:r};
    }
    case "log_outreach": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.outreachLog.push({method:args.method,outcome:args.outcome,notes:args.notes,at:_ts()});
      if (args.outcome==="Reached") r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,outcome:args.outcome,record:r};
    }
    case "close_record": {
      const r=_store.clientSchedule.find(r=>r.id===args.recordId);
      if (!r) return {error:"Not found"};
      r.status="Closed"; r.closeReason=args.reason; r.followUpRequired=false;
      return {success:true,recordId:args.recordId,patient:r.patient,reason:args.reason,record:r};
    }
    default: return {error:"Unknown tool: "+name};
  }
}
;

// ─── buildAttGroups ───────────────────────────────────────────────────────────
function buildAttGroups() {
  // Synthetic date: 2026-03-18 (Wednesday). Medicare week: Sun 2026-03-15.
  const today = new Date('2026-03-18T00:00:00');
  const now = new Date();
  const isAfternoon = now.getHours() >= 12;
  const dayOfWeek = today.getDay(); // Wednesday = 3
  const medicareWeekStart = new Date('2026-03-15T00:00:00'); // Sunday
  const todayStr = '2026-03-18';

  const as = serverCall("get_agent_summary_report",{});
  const wv = serverCall("get_agent_summary_weekly",{});
  const sr = serverCall("get_scheduling_requests",{});
  const cs = serverCall("get_client_schedule_report",{});

  // ── Agent Summary (today's records only) ──────────────────────────────────
  const pendingToday      = as.records.filter(r=>r.visitStatus==="Pending" && r.visitDate===todayStr);
  const checkedOutToday   = as.records.filter(r=>r.visitStatus==="Checked Out" && r.visitDate===todayStr);

  // ── Weekly Summary (past days in current week, not today) ─────────────────
  const pastThisWeek      = r => { const d=new Date(r.visitDate+"T00:00:00"); return d>=medicareWeekStart && d<today; };
  const lateVisits        = wv.records.filter(r=>r.visitStatus==="Late" && pastThisWeek(r));
  const incompleteBefore  = wv.records.filter(r=>r.visitStatus==="Incomplete" && pastThisWeek(r) && !isAfternoon);
  const incompleteAfter   = wv.records.filter(r=>r.visitStatus==="Incomplete" && pastThisWeek(r) && isAfternoon);
  const almostComplete    = wv.records.filter(r=>r.visitStatus==="Almost Complete" && pastThisWeek(r));

  // ── Scheduling Requests ───────────────────────────────────────────────────
  const srToday    = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d>=today; });
  const srThisWeek = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d>=medicareWeekStart && d<today; });
  const srOld      = sr.records.filter(r=>{ const d=new Date((r.shiftDate||r.visitDate||"")+"T00:00:00"); return d<medicareWeekStart; });

  // ── Client Schedule ───────────────────────────────────────────────────────
  const csNeedsSchedule = cs.records.filter(r=>["Missed","Declined","Rescheduled","Reassigned"].includes(r.visitStatus||r.statusName));

  const G = (label, color, nav, rows, actions, description) =>
    rows.length && { label, color, nav, rows, actions, description };

  return [
    // Agent Summary
    G(`${pendingToday.length} pending visit${pendingToday.length>1?"s":""} today`,
      "#0ea5e9",
      {dataset:"agentSummary", filterKey:"visitStatus", filterVal:"Pending", tileFilter:"pending"},
      pendingToday,
      ["Follow Up"],
      "Follow up with the agent on each pending visit to confirm status."),

    G(`${checkedOutToday.length} checked-out visit${checkedOutToday.length>1?"s":""} today`,
      "#0ea5e9",
      {dataset:"agentSummary", filterKey:"visitStatus", filterVal:"Checked Out", tileFilter:"checkedOut"},
      checkedOutToday,
      ["Follow Up"],
      "Contact the agent to follow up on each checked-out visit and confirm current status."),

    // Weekly Summary
    G(`${lateVisits.length} late visit${lateVisits.length>1?"s":""} from earlier this week`,
      "#ef4444",
      {dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Late", tileFilter:"late"},
      lateVisits,
      ["Mark Missed"],
      "These visits are late with no resolution. Mark each as missed in the system."),

    ...( incompleteBefore.length ? [
    { label:`${incompleteBefore.length} incomplete visit${incompleteBefore.length>1?"s":""} - resolve before afternoon`,
      color:"#d97706",
      nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Incomplete", tileFilter:"incomplete"},
      rows:incompleteBefore, actions:["Resolve Before Afternoon"],
      description:"These visits must be resolved before afternoon. This is a reminder - no external action required yet." }
    ] : []),

    ...( incompleteAfter.length ? [
    { label:`${incompleteAfter.length} incomplete visit${incompleteAfter.length>1?"s":""} - past afternoon deadline`,
      color:"#dc2626",
      nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Incomplete", tileFilter:"incomplete"},
      rows:incompleteAfter, actions:["Follow Up"],
      description:"These visits are past the afternoon deadline. Follow up with the clinician immediately to resolve." }
    ] : []),

    G(almostComplete.length ? `${almostComplete.length} almost-complete visit${almostComplete.length>1?"s":""} - HCHB ticket needed` : "",
      "#3b82f6",
      {dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Almost Complete", tileFilter:"almostComplete"},
      almostComplete,
      ["Create HCHB Ticket"],
      "Each almost-complete visit requires a corresponding HCHB ticket to be created and closed."),

    // ── Paused visits ──────────────────────────────────────────────────────
    ...(() => {
      const pausedVisits = wv.records.filter(r=>r.visitStatus==="Paused" && pastThisWeek(r));
      return pausedVisits.length ? [{
        label:`${pausedVisits.length} paused visit${pausedVisits.length>1?"s":""} from earlier this week`,
        color:"#0ea5e9",
        nav:{dataset:"weeklyVisits", filterKey:"visitStatus", filterVal:"Paused", tileFilter:"paused"},
        rows:pausedVisits, actions:["Follow Up"],
        description:"Follow up with the assigned agent on each paused visit to determine next steps."
      }] : [];
    })(),

    // Scheduling Requests
    G(`${srToday.length} unscheduled request${srToday.length>1?"s":""} for today or a future date`,
      "#2563eb",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srToday,
      ["Schedule Visit"],
      "Assign each of these requests to an available clinician as soon as possible."),

    G(`${srThisWeek.length} unscheduled request${srThisWeek.length>1?"s":""} from earlier this week`,
      "#059669",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srThisWeek,
      ["Reschedule Visit"],
      "These visits are from earlier this Medicare week and can be rescheduled within the same week."),

    G(`${srOld.length} unscheduled request${srOld.length>1?"s":""} from a previous Medicare week`,
      "#dc2626",
      {dataset:"schedulingRequests", filterKey:"requestStatus", filterVal:"Unscheduled", tileFilter:"unscheduled"},
      srOld,
      ["Schedule Visit", "Write New Order"],
      "These visits are from a prior Medicare week. Mark them as missed or write a new order to void."),

    // Client Schedule
    G(`${csNeedsSchedule.length} client visit${csNeedsSchedule.length>1?"s":""} requiring scheduling`,
      "#2563eb",
      {dataset:"clientSchedule", filterKey:"visitStatus", filterVal:"", tileFilter:""},
      csNeedsSchedule,
      ["Reschedule Visit"],
      "Open the scheduling console and schedule each of these client visits."),

  ].filter(Boolean);
}

function esc(s){ if(!s)return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
// ─── Row Action Logic ─────────────────────────────────────────────────────────
function getRowActions(ds, row) {
  const today = new Date(); today.setHours(0,0,0,0);
  const now = new Date();
  const isAfternoon = now.getHours() >= 12;
  const dayOfWeek = today.getDay();
  const medicareWeekStart = new Date(today); medicareWeekStart.setDate(today.getDate() - dayOfWeek);

  const btn = (label, color="#2563eb", tier="primary", nonClickable=false) => ({label, color, outline:tier, nonClickable});

  // Agent Summary: today only, Pending or Checked Out → Follow Up
  if (ds === "agentSummary") {
    if (row.visitStatus === "Pending" || row.visitStatus === "Checked Out")
      return [btn("Follow Up", "#b45309", "urgent-low")];
    return [];
  }

  // Weekly Summary: last Sunday to yesterday
  // Late or Paused → Follow Up
  // Incomplete before noon → Resolve Before Afternoon (non-clickable reminder)
  // Incomplete after noon → Follow Up
  // Almost Complete → Create HCHB Ticket
  if (ds === "weeklyVisits") {
    const visitDt = row.visitDate ? new Date(row.visitDate + "T00:00:00") : null;
    const isPast = visitDt && visitDt < today && visitDt >= medicareWeekStart;
    if (!isPast) return [];
    if (row.visitStatus === "Late" || row.visitStatus === "Paused")
      return [btn("Follow Up", "#b45309", "urgent-low")];
    if (row.visitStatus === "Incomplete") {
      return isAfternoon
        ? [btn("Follow Up", "#b45309", "urgent-low")]
        : [btn("Resolve Before Afternoon", "#475569", "reminder", true)];
    }
    if (row.visitStatus === "Almost Complete")
      return [btn("Create HCHB Ticket", "#1d4ed8", "primary")];
    return [];
  }

  // Scheduling Requests: all unscheduled → Schedule Visit
  if (ds === "schedulingRequests") {
    const srDt = row.shiftDate ? new Date(row.shiftDate + "T00:00:00") : null;
    if (!srDt) return [];
    return [btn("Schedule Visit", "#0369a1", "primary")];
  }


  // Client Schedule: Missed, Declined, Rescheduled, Reassigned → Schedule in Console
  if (ds === "clientSchedule") {
    if (["Missed","Declined","Rescheduled","Reassigned"].includes(row.visitStatus || row.statusName))
      return [btn("Reschedule Visit", "#1d4ed8", "primary")];
    return [];
  }

  return [];
}

// Generate a plain-English text summary for a result
function buildResultSummary(msg) {
  if (msg.type === 'attention') {
    var total = (msg.sections||[]).reduce(function(s,g){return s+g.rows.length;},0);
    if (total === 0) return '<p style="font-size:12px;color:#374151;line-height:1.6;margin:0 0 10px;">'+esc('No urgent actions outstanding right now.')+'</p>';
    return '<p style="font-size:12px;color:#374151;line-height:1.6;margin:0 0 10px;">'+esc(msg.summaryLine)+'</p>';
  }
  if (msg.type === 'table') {
    var rows = msg.rows || [];
    var total = rows.length;
    if (total === 0) return '<p style="font-size:12px;color:#374151;line-height:1.6;margin:0 0 10px;">No records found.</p>';
    return '<p style="font-size:12px;color:#374151;line-height:1.6;margin:0 0 10px;">'+esc(total+' record'+(total===1?'':'s')+'.')+'</p>';
  }
  return '';
}

// Natural language query matching
function matchQuery(text) {
  var t = text.toLowerCase().trim();
  // attention / today
  if (/attention|today|urgent|priority/.test(t)) return qAtt();
  if (/agent.?summ|all.?visit|pending.?visit|visit.?today/.test(t)) return qDS('agentSummary','get_agent_summary_report',{},'Agent Summary');
  if (/pending/.test(t)) return qDS('agentSummary','get_agent_summary_report',{visitStatus:'Pending'},'Pending Visits');
  if (/checked.?out/.test(t)) return qDS('agentSummary','get_agent_summary_report',{visitStatus:'Checked Out'},'Checked-Out Visits');
  if (/eval.?sign|sign.?off|reqeval/.test(t)) return qDS('agentSummary','get_agent_summary_report',{reqEval:'Y'},'Eval Sign-Off Needed');
  if (/james.?patel|patel/.test(t)) return qDS('agentSummary','get_agent_summary_report',{agentName:'James Patel'},'Dr. James Patel');
  if (/weekly|week.?summ/.test(t)) return qDS('weeklyVisits','get_agent_summary_weekly',{},'Weekly Summary');
  if (/late/.test(t)) return qDS('weeklyVisits','get_agent_summary_weekly',{visitStatus:'Late'},'Late Visits');
  if (/incomplete/.test(t)) return qDS('weeklyVisits','get_agent_summary_weekly',{visitStatus:'Incomplete'},'Incomplete Visits');
  if (/almost.?complete|almost/.test(t)) return qDS('weeklyVisits','get_agent_summary_weekly',{visitStatus:'Almost Complete'},'Almost Complete');
  if (/paused/.test(t)) return qDS('weeklyVisits','get_agent_summary_weekly',{visitStatus:'Paused'},'Paused Visits');
  if (/sched.?req|request/.test(t)) return qDS('schedulingRequests','get_scheduling_requests',{},'Scheduling Requests');
  if (/unschedul/.test(t)) return qDS('schedulingRequests','get_scheduling_requests',{requestStatus:'Unscheduled'},'Unscheduled Requests');
  if (/client.?sched|client/.test(t)) return qDS('clientSchedule','get_client_schedule_report',{},'Client Schedule');
  if (/missed/.test(t)) return qDS('clientSchedule','get_client_schedule_report',{visitStatus:'Missed'},'Missed Visits');
  if (/declined/.test(t)) return qDS('clientSchedule','get_client_schedule_report',{visitStatus:'Declined'},'Declined Visits');
  if (/reschedul/.test(t)) return qDS('clientSchedule','get_client_schedule_report',{visitStatus:'Rescheduled'},'Rescheduled Visits');
  if (/reassign/.test(t)) return qDS('clientSchedule','get_client_schedule_report',{visitStatus:'Reassigned'},'Reassigned Visits');
  return null;
}

function qAtt() {
  var groups=buildAttGroups(), total=groups.reduce(function(s,g){return s+g.rows.length;},0);
  var sl = total===0 ? 'No urgent actions outstanding.' : total+' item'+(total>1?'s':'')+' across '+groups.length+' area'+(groups.length>1?'s':'')+' need attention.';
  var sections=groups.map(function(g){return {label:g.label,color:g.color,dataset:g.nav.dataset,rows:g.rows,description:g.description};});
  return {type:'attention', summaryLine:sl, sections:sections, intent:'Attention Summary'};
}

function qDS(ds, tool, args, intent) {
  var r = serverCall(tool, args);
  return {type:'table', dataset:ds, rows:r.records||[], summary:r.summary||null, intent:intent};
}

  if (!state.colConfig[ds]) {
    var a=[...RC[ds].cols], v=new Set(DEFAULT_VISIBLE[ds]||a);
    state.colConfig[ds]={cols:a,hidden:new Set(a.filter(function(c){return !v.has(c);}))};
  }
  return state.colConfig[ds];
}
var msgIdCounter=0;
function addMsg(msg){state.thread.push(Object.assign({},msg,{_id:++msgIdCounter}));}
function removeTyping(){state.thread=state.thread.filter(function(m){return m.role!=='typing';});}
function scrollThread(){setTimeout(function(){var e=document.getElementById('thread-end');if(e)e.scrollIntoView({behavior:'smooth'});},50);}

var state = {username:'Scheduler',thread:[],busy:false,modal:null,actionMode:null,sectionOpenState:{},tileFilters:{},sortState:{},colConfig:{},colPanels:{}};

function sendQuery(text) {
  if (state.busy || !text.trim()) return;
  state.busy = true;
  addMsg({role:'user', text:text});
  addMsg({role:'typing'});
  renderChatOnly();
  setTimeout(function() {
    removeTyping();
    var result = matchQuery(text);
    if (!result) result = {type:'raw', text:"I didn't understand that. Try asking about: pending visits, late visits, scheduling requests, weekly summary, or attention items."};
    addMsg(Object.assign({role:'assistant'}, result));
    state.busy = false;
    renderChatOnly();
    scrollThread();
  }, 350);
}

function renderApp() {
  var app = document.getElementById('app');
  // welcome modal removed - username defaults to 'Scheduler'
  app.innerHTML = renderTopBar() + '<div style="flex:1;display:flex;overflow:hidden;">' + renderChatPane() + '</div>' + renderActionModal();
  bindAll(); scrollThread();
}

function renderWelcome() {
  return '<div class="modal-backdrop" style="z-index:100;">'+
    '<div style="background:#ffffff;border:1px solid rgba(37,99,235,.25);border-radius:18px;padding:40px 36px;width:360px;max-width:92vw;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:fadeIn .3s ease;">'+
    '<div style="width:48px;height:48px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px;">&#127973;</div>'+
    '<h2 style="font-size:21px;font-weight:800;color:#1e293b;letter-spacing:-.4px;margin:0 0 6px;">EHR Scheduler</h2>'+
    '<p style="font-size:13px;color:#0f172a;margin:0 0 24px;line-height:1.6;">What should we call you?</p>'+
    '<input id="name-input" placeholder="Your name…" style="width:100%;box-sizing:border-box;background:#f1f5f9;border:1px solid rgba(37,99,235,.3);border-radius:10px;padding:11px 14px;color:#1e293b;font-size:14px;font-family:inherit;margin-bottom:14px;"/>'+
    '<button id="start-btn" style="width:100%;padding:11px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Get started →</button>'+
    '</div></div>';
}

function renderTopBar() {
  var now=new Date(),ist=new Date(now.getTime()+5.5*60*60000+now.getTimezoneOffset()*60000),h=ist.getHours();
  var g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  return '<div style="background:#ffffff;border-bottom:1px solid #94a3b8;padding:0 20px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">'+
    '<div style="display:flex;align-items:center;gap:8px;">'+
    '<div style="width:24px;height:24px;background:linear-gradient(135deg,#2563eb,#3b82f6);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;">&#127973;</div>'+
    '<span style="font-weight:700;font-size:14px;color:#1e293b;letter-spacing:-.3px;">EHR Scheduler</span></div>'+
    (state.username?'<span style="font-size:12px;color:#0f172a;">'+g+', <span style="color:#2563eb;font-weight:600;">'+esc(state.username)+'</span></span>':'')+
    '</div>';
}

function renderConstantBar() {
  var pills = [
    {label:'What needs attention today?', q:'What needs attention today?'},
    {label:'Agent Summary',               q:'Agent summary'},
    {label:'Weekly Summary',              q:'Weekly summary'},
    {label:'Scheduling Requests',         q:'Scheduling requests'},
    {label:'Client Schedule',             q:'Client schedule'},
  ];
  var html = '<div style="padding:7px 14px;display:flex;gap:6px;align-items:center;border-top:1px solid #e9edf2;flex-shrink:0;background:#ffffff;overflow-x:auto;scrollbar-width:none;">';
  for (var i=0;i<pills.length;i++) {
    html += '<button class="send-chip-btn chip" data-q="'+esc(pills[i].q)+'" style="font-size:11px;padding:4px 11px;white-space:nowrap;">'+esc(pills[i].label)+'</button>';
  }
  html += '</div>';
  return html;
}

function renderChatPane() {
  return '<div style="flex:1;display:flex;flex-direction:column;width:100%;overflow:hidden;">' +
    '<div id="chat-thread" style="flex:1;overflow-y:auto;padding:20px 20px 0;">' + renderThread() + '</div>' +
    '<div id="bottom-bar">' + renderBottomBar() + '</div>' +
    renderConstantBar() +
    '</div>';
}

function renderBottomBar() { return ''; }

function getDynamicSuggestions(lastMsg) {
  // If no last message, show default suggestions
  if (!lastMsg) return SUGGESTIONS.slice(0, 6);

  // Dataset-specific follow-up questions
  var ds = lastMsg.dataset || '';
  var sum = lastMsg.summary || {};
  var suggestions = [];

  if (lastMsg.type === 'attention') {
    suggestions = [
      {label:'Agent Summary', q:'Agent summary'},
      {label:'Weekly Summary', q:'Weekly summary'},
      {label:'Scheduling Requests', q:'Scheduling requests'},
      {label:'Client Schedule', q:'Client schedule'},
      {label:'Pending visits', q:'Pending visits'},
      {label:'Missed Visits', q:'Missed visits'},
    ];
  } else if (ds === 'agentSummary') {
    suggestions = [
      {label:'What needs attention today?', q:'What needs attention today?'},
      {label:'Show Pending Visits', q:'Show all pending visits'},
      {label:'Checked Out Visits', q:'Checked out visits'},
      {label:'Visits requiring eval', q:'Visits requiring eval sign-off'},
      {label:'Weekly Summary', q:'Weekly summary'},
      {label:'Scheduling Requests', q:'Scheduling requests'},
    ];
  } else if (ds === 'weeklyVisits') {
    suggestions = [
      {label:'What needs attention today?', q:'What needs attention today?'},
      {label:'Late visits', q:'Late visits this week'},
      {label:'Incomplete Visits', q:'Show incomplete visits'},
      {label:'Almost Complete', q:'Almost complete visits'},
      {label:'Paused Visits', q:'Paused visits'},
      {label:'Agent Summary', q:'Agent summary'},
    ];
  } else if (ds === 'schedulingRequests') {
    suggestions = [
      {label:'What needs attention today?', q:'What needs attention today?'},
      {label:'Unscheduled requests', q:'Show unscheduled requests'},
      {label:'Client Schedule', q:'Client schedule'},
      {label:'Agent Summary', q:'Agent summary'},
      {label:'Missed Visits', q:'Missed visits needing follow-up'},
      {label:'Weekly Summary', q:'Weekly summary'},
    ];
  } else if (ds === 'clientSchedule') {
    suggestions = [
      {label:'What needs attention today?', q:'What needs attention today?'},
      {label:'Missed Visits', q:'Missed visits needing follow-up'},
      {label:'Declined Visits', q:'Show declined visits'},
      {label:'Rescheduled Visits', q:'Rescheduled visits'},
      {label:'Scheduling Requests', q:'Scheduling requests'},
      {label:'Agent Summary', q:'Agent summary'},
    ];
  } else {
    suggestions = SUGGESTIONS.slice(0, 6);
  }
  return suggestions;
}

function renderThread() {
  if (!state.thread.length) {
    var helpItems = [
      {icon:'&#128269;', title:'Ask About Today', text:'Get a snapshot of all visits, checked-out cases, and pending actions for the current day.'},
      {icon:'&#128197;', title:'Review The Week', text:'See late, incomplete, paused, and almost-complete visits from earlier in the Medicare week.'},
      {icon:'&#128467;', title:'Manage Scheduling', text:'View unscheduled requests by priority - today, this week, or from a previous Medicare week.'},
      {icon:'&#128101;', title:'Client Schedule', text:'Find missed, declined, rescheduled, or reassigned visits that still need a scheduling action.'},
    ];
    var cards = '';
    for (var i=0;i<helpItems.length;i++) {
      var h = helpItems[i];
      cards += '<div style="background:#ffffff;border:0.3px solid #0f172a;border-radius:8px;padding:14px 16px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.08);">';
      cards += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
      cards += '<span style="font-size:16px;">'+h.icon+'</span>';
      cards += '<span style="font-size:12px;font-weight:700;color:#1e293b;">'+h.title+'</span>';
      cards += '</div>';
      cards += '<p style="font-size:11.5px;color:#0f172a;line-height:1.6;margin:0;">'+h.text+'</p>';
      cards += '</div>';
    }
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:48px 20px 24px;max-width:680px;margin:0 auto;">' +
      '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;">' +
      '<div style="width:52px;height:52px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 32px rgba(37,99,235,.2);">&#127973;</div>' +
      '<h2 style="font-size:17px;font-weight:800;color:#1e293b;margin:0;">EHR Scheduling Assistant</h2>' +
      '<p style="color:#0f172a;font-size:13px;line-height:1.7;max-width:400px;margin:0;">Ask a question or pick a suggestion below. Results appear here as live, interactive tables.</p>' +
      '</div>' +
      '<div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;">' + cards + '</div>' +
      '</div><div id="thread-end"></div>';
  }
  return state.thread.map(renderMsg).join('') + '<div id="thread-end"></div>';
}
function renderMsg(msg) {
  if (msg.role === 'user') {
    return '<div class="chat-msg" style="display:flex;justify-content:flex-end;margin-bottom:14px;">'+
      '<div style="background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:14px 14px 3px 14px;padding:9px 14px;max-width:75%;box-shadow:0 4px 14px rgba(37,99,235,.15);">'+
      '<p style="font-size:13px;color:#fff;line-height:1.5;margin:0;">'+esc(msg.text)+'</p></div></div>';
  }
  if (msg.role === 'typing') {
    return '<div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;">'+
      '<div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;">&#129302;</div>'+
      '<div style="background:#ffffff;border:1px solid #e9edf2;border-radius:3px 12px 12px 12px;padding:10px 14px;display:flex;gap:5px;align-items:center;">'+
      [0,1,2].map(function(i){return '<span style="width:6px;height:6px;border-radius:50%;background:#3b5bdb;display:inline-block;animation:blink 1.2s '+(i*.22)+'s infinite;"></span>';}).join('')+
      '</div></div>';
  }
  if (msg.role === 'assistant') {
    var pfx = 'msg-'+(msg._id||'x');
    var activeTile = state.tileFilters[pfx] || null;
    var sort = state.sortState[pfx] || {col:null,dir:'asc'};
    var content = '';
    if (msg.intent) content += '<div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;"><span style="width:4px;height:4px;border-radius:50%;background:#3b5bdb;display:inline-block;"></span><span style="font-size:10px;font-weight:700;color:#3b5bdb;text-transform:uppercase;letter-spacing:.9px;">'+esc(msg.intent)+'</span></div>';
    if (msg.type === 'attention') {
      content += '<p style="font-size:12.5px;color:#0f172a;line-height:1.6;margin:0 0 10px;">'+esc(msg.summaryLine)+'</p>';
      var sections = msg.sections||[];
      for (var i=0;i<sections.length;i++) {
        var ok = (state.sectionOpenState[pfx+'-'+i]);
        content += renderAttentionSection(sections[i], i, pfx+'-'+i, !!ok, true);
      }
    }
    if (msg.type === 'table') {
      var sumTxt = buildResultSummary(msg);
      if (sumTxt) content += sumTxt;
      var rows = msg.rows||[];
      if (sort.col) rows = rows.slice().sort(function(a,b){var av=a[sort.col]||'',bv=b[sort.col]||'';return sort.dir==='asc'?(av>bv?1:av<bv?-1:0):(av<bv?1:av>bv?-1:0);});
      content += renderDataTable(msg.dataset, rows, msg.summary, msg._id, activeTile, sort.col, sort.dir, true);
    }
    if (msg.type === 'action-result') content += renderActionResult(msg);
    if (msg.type === 'raw') content += '<p style="font-size:12.5px;color:#0f172a;line-height:1.6;background:#ffffff;padding:10px 12px;border-radius:8px;border:1px solid #e2e8f0;">'+esc(msg.text)+'</p>';
    return '<div class="chat-msg" style="display:flex;gap:8px;margin-bottom:18px;align-items:flex-start;">'+
      '<div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;">&#129302;</div>'+
      '<div style="flex:1;min-width:0;">'+content+'</div></div>';
  }
  return '';
}

function renderChatOnly() {
  var ct = document.getElementById('chat-thread');
  if (!ct) { renderApp(); return; }
  var st = ct.scrollTop;
  ct.innerHTML = renderThread();
  var bb = document.getElementById('bottom-bar');
  if (bb) bb.innerHTML = renderBottomBar();
  bindAll();
  ct.scrollTop = st;
}

function bindAll() {
  // Welcome
  var sb = document.getElementById('start-btn');
  if (sb) {
    var ni = document.getElementById('name-input');
    var go = function(){var n=ni&&ni.value.trim();if(n){state.username=n;renderApp();}};
    sb.addEventListener('click', go);
    if (ni) ni.addEventListener('keydown', function(e){if(e.key==='Enter')go();});
  }
  // (chat input removed - query via suggestion chips)
  // Suggestion chips
  document.querySelectorAll('.send-chip-btn').forEach(function(b){
    b.addEventListener('click', function(){sendQuery(b.dataset.q);});
  });
  // Attention section toggles
  document.querySelectorAll('.att-toggle').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.key;
      state.sectionOpenState[k] = !state.sectionOpenState[k];
      renderChatOnly();
    });
  });
  // Tile pill filters
  document.querySelectorAll('.tile-pill-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var pfx=b.dataset.pfx, k=b.dataset.key;
      state.tileFilters[pfx] = state.tileFilters[pfx]===k ? null : k;
      renderChatOnly();
    });
  });
  document.querySelectorAll('.tile-pill-clear').forEach(function(b){
    b.addEventListener('click', function(){state.tileFilters[b.dataset.pfx]=null;renderChatOnly();});
  });
  // Sort headers
  document.querySelectorAll('.sort-th').forEach(function(th){
    th.addEventListener('click', function(){
      var pfx=th.dataset.pfx, col=th.dataset.col;
      var cur = state.sortState[pfx]||{col:null,dir:'asc'};
      state.sortState[pfx] = {col:col, dir:(cur.col===col && cur.dir==='asc')?'desc':'asc'};
      renderChatOnly();
    });
  });
  bindModalEvents();

  // Column panel open/close
  document.querySelectorAll('.col-panel-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var pfx=b.dataset.pfx;
      if(!state.colPanels) state.colPanels={};
      state.colPanels[pfx]=!state.colPanels[pfx];
      renderChatOnly();
    });
  });
  document.querySelectorAll('.col-panel-close').forEach(function(b){
    b.addEventListener('click', function(){
      if(state.colPanels) state.colPanels[b.dataset.pfx]=false;
      renderChatOnly();
    });
  });
  // Column visibility toggle
  document.querySelectorAll('.col-toggle-label').forEach(function(lbl){
    lbl.addEventListener('click', function(e){
      e.preventDefault();
      var ds_key=null, pfx=lbl.dataset.pfx, col=lbl.dataset.col;
      // find ds from the table's pfx - look for it in the DOM
      var panelEl=lbl.closest('[data-ds]');
      var ds2=panelEl?panelEl.dataset.ds:null;
      if(!ds2){
        // try to find from nearby data table
        var tableWrap=lbl.closest('div[style*="position:relative"]');
        ds2=tableWrap?tableWrap.dataset.ds:null;
      }
      // fallback: find from col-reset-btn sibling
      var resetBtn=lbl.closest('div').querySelector('.col-reset-btn');
      if(!ds2&&resetBtn) ds2=resetBtn.dataset.ds;
      if(!ds2) return;
      var cfg=getColCfg(ds2);
      if(cfg.hidden.has(col)) cfg.hidden.delete(col); else cfg.hidden.add(col);
      renderChatOnly();
    });
  });
  document.querySelectorAll('.col-reset-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var ds2=b.dataset.ds;
      if(ds2) { state.colConfig[ds2]=null; getColCfg(ds2); }
      renderChatOnly();
    });
  });
}

renderApp();
